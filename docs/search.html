<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy 검색</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    /* ── 버튼 ── */
    #searchBtn {
      width: 100%;
      padding: 14px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    #searchBtn:hover:not(:disabled) { background: #4f46e5; transform: translateY(-1px); }
    #searchBtn:active:not(:disabled) { transform: translateY(0); }
    #searchBtn:disabled { background: #a5b4fc; cursor: not-allowed; }
    #searchBtn.searching { background: #818cf8; cursor: not-allowed; }
    #searchBtn.unconfigured { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; pointer-events: auto; }

    /* ── 상태 메시지 ── */
    #status {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      text-align: center;
      display: none;
    }
    #status.searching {
      display: block;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
    }
    #status.accepted {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    #status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* ── 설정 안내 (파라미터 없을 때) ── */
    .config-guide {
      width: 100%;
      padding: 12px 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.6;
      text-align: center;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="searchBtn">🚀 검색하기</button>
    <div id="status"></div>
    <div class="config-guide" id="configGuide">
      셋업을 완료하면 이 버튼이 활성화됩니다.<br>
      <a href="https://pchanul.github.io/Snappy/" target="_blank"
         style="color:#c2410c;font-weight:600;">시작하기 →</a>
    </div>
  </div>

  <script>
    const FUNCTION_BASE = 'https://mmnwbkbipjnmsvtyohjg.supabase.co/functions/v1';

    const params    = new URLSearchParams(location.search);
    const userId    = params.get('user_id');
    const pageId    = params.get('page_id');
    const searching = params.get('searching') === '1';

    const btn         = document.getElementById('searchBtn');
    const status      = document.getElementById('status');
    const configGuide = document.getElementById('configGuide');

    const configured = !!(userId && pageId);

    // ── 초기 상태 렌더링 ─────────────────────────────────────────────────────
    if (!configured) {
      btn.classList.add('unconfigured');
    } else if (searching) {
      // URL에 ?searching=1 → 다른 기기/새 탭에서 진행 중인 검색 표시
      btn.disabled = true;
      btn.classList.add('searching');
      btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
      status.className = 'searching';
      status.textContent = '노션에서 검색 결과를 작성하고 있어요...';
    }

    // ── 버튼 클릭 ────────────────────────────────────────────────────────────
    btn.addEventListener('click', async () => {
      if (!configured) { configGuide.style.display = 'block'; return; }
      if (btn.disabled) return;

      // 1. 즉시 UI 비활성
      btn.disabled = true;
      btn.classList.add('searching');
      btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
      status.className = 'searching';
      status.textContent = '노션 페이지에서 키워드를 읽어오고 있어요...';

      try {
        // 2. 임베드 URL에 ?searching=1 추가 (다른 기기/새 탭 차단용)
        await fetch(FUNCTION_BASE + '/manage-user?action=set-search-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, searching: true }),
        });

        // 3. 검색 트리거
        const res = await fetch(FUNCTION_BASE + '/trigger-search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, notion_page_id: pageId }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.userMessage || data.message || '검색 요청에 실패했습니다.');

        // 202 수신 — 버튼 계속 비활성, 서버가 완료 후 URL 복원
        status.textContent = '노션에서 검색 결과를 작성하고 있어요...';

      } catch (err) {
        // 에러 시 임베드 URL 즉시 복원
        fetch(FUNCTION_BASE + '/manage-user?action=set-search-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, searching: false }),
        }).catch(() => {});
        btn.disabled = false;
        btn.classList.remove('searching');
        btn.innerHTML = '🚀 검색하기';
        status.className = 'error';
        status.textContent = err.message;
      }
    });
  </script>
</body>
</html>
