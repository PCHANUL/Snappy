<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy 검색</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 520px;
    }

    /* ── 입력 필드 ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #4b5563;
      letter-spacing: -0.2px;
    }
    #keyword {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #111827;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #keyword:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
      gap: 10px;
      align-items: start;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #f8fafc;
    }

    .segment-btn {
      min-width: 0;
      min-height: 34px;
      padding: 7px 6px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #64748b;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .segment-btn:hover { color: #334155; background: #fff; }
    .segment-btn.active {
      background: #111827;
      border-color: #111827;
      color: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.16);
    }

    /* ── 매체 칩 ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #6b7280;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: #a5b4fc; }
    .chip.active {
      background: #eef2ff;
      border-color: #6366f1;
      color: #4338ca;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .platform-chip {
      min-width: 0;
      min-height: 34px;
      padding: 7px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.2;
    }

    .platform-chip::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #cbd5e1;
      flex: 0 0 auto;
    }

    .platform-chip.active::before { background: #6366f1; }

    .mini-action {
      border: 0;
      background: transparent;
      color: #6366f1;
      font-size: 0.74rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      padding: 0 2px;
    }
    .mini-action:hover { color: #4338ca; }

    /* ── 버튼 ── */
    #searchBtn {
      width: 116px;
      min-height: 43px;
      padding: 11px 14px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }
    #searchBtn:hover:not(:disabled) { background: #4f46e5; transform: translateY(-1px); }
    #searchBtn:active:not(:disabled) { transform: translateY(0); }
    #searchBtn:disabled { background: #a5b4fc; cursor: not-allowed; }
    #searchBtn.searching { background: #818cf8; cursor: not-allowed; }
    #searchBtn.unconfigured { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; pointer-events: auto; }

    /* ── 상태 메시지 ── */
    #status {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      text-align: center;
      display: none;
    }
    #status.searching {
      display: block;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
    }
    #status.accepted {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    #status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* ── 설정 안내 (파라미터 없을 때) ── */
    .config-guide {
      width: 100%;
      padding: 12px 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.6;
      text-align: center;
      display: none;
    }

    /* ── 자동완성 드롭다운 ── */
    .kw-wrap { position: relative; }
    .suggest {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      z-index: 20;
      display: none;
    }
    .suggest.open { display: block; }
    .suggest-item {
      padding: 9px 14px;
      font-size: 0.9rem;
      color: #374151;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .suggest-item:hover, .suggest-item.active {
      background: #eef2ff;
      color: #4338ca;
    }
    .suggest-item .ico { font-size: 0.78rem; color: #9ca3af; flex-shrink: 0; }

    /* ── 키워드 트렌드 ── */
    #keywordTrend {
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #374151;
      text-align: center;
      line-height: 1.7;
    }

    /* ── 연관 인기 키워드 ── */
    #relatedSection { margin-top: 4px; }
    .related-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }
    .related-chip {
      padding: 6px 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      color: #1d4ed8;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .related-chip:hover { background: #dbeafe; border-color: #93c5fd; }
    .related-chip .ratio {
      font-size: 0.72rem;
      font-weight: 700;
      color: #3b82f6;
      background: #bfdbfe;
      border-radius: 999px;
      padding: 1px 5px;
    }

    #form { display: flex; flex-direction: column; gap: 10px; }
    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 116px;
      gap: 8px;
      align-items: start;
    }

    @media (max-width: 430px) {
      body { padding: 12px; }
      .filter-grid { grid-template-columns: 1fr; }
      .search-row { grid-template-columns: 1fr; }
      #searchBtn { width: 100%; }
    }

    .disabled-overlay { opacity: 0.5; pointer-events: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="form">
      <div class="filter-grid">
        <div class="field">
          <span class="label" id="periodLabel">기간</span>
          <div class="segmented" id="periods" role="radiogroup" aria-labelledby="periodLabel">
            <button type="button" class="segment-btn" data-value="day" role="radio" aria-checked="false">1일</button>
            <button type="button" class="segment-btn" data-value="week" role="radio" aria-checked="false">1주</button>
            <button type="button" class="segment-btn active" data-value="month" role="radio" aria-checked="true">1개월</button>
            <button type="button" class="segment-btn" data-value="year" role="radio" aria-checked="false">1년</button>
          </div>
          <input id="period" type="hidden" value="month">
        </div>

        <div class="field">
          <div class="label-row">
            <span class="label" id="platformsLabel">매체</span>
            <button type="button" class="mini-action" id="allPlatformsBtn">전체</button>
          </div>
          <div class="platform-grid" id="platforms" aria-labelledby="platformsLabel">
            <button type="button" class="chip platform-chip active" data-value="naver_blog" aria-pressed="true">네이버</button>
            <button type="button" class="chip platform-chip active" data-value="youtube" aria-pressed="true">유튜브</button>
            <button type="button" class="chip platform-chip active" data-value="youtube_shorts" aria-pressed="true">숏츠</button>
            <button type="button" class="chip platform-chip active" data-value="tistory" aria-pressed="true">티스토리</button>
            <button type="button" class="chip platform-chip active" data-value="brunch" aria-pressed="true">브런치</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label" for="keyword">키워드</label>
        <div class="search-row">
          <div class="kw-wrap">
            <input id="keyword" type="text" placeholder="검색할 단어 (예: 비건 디저트)" maxlength="100" autocomplete="off">
            <div id="suggest" class="suggest"></div>
          </div>
          <button id="searchBtn" type="button">검색하기</button>
        </div>
      </div>
    </div>

    <div id="status"></div>
    <div id="relatedSection" style="display:none">
      <div class="related-label">📊 연관 인기 키워드</div>
      <div class="chips" id="relatedChips"></div>
    </div>
    <div id="keywordTrend" style="display:none"></div>
    <div class="config-guide" id="configGuide">
      셋업을 완료하면 이 버튼이 활성화됩니다.<br>
      <a href="https://pchanul.github.io/Snappy/" target="_blank"
         style="color:#c2410c;font-weight:600;">시작하기 →</a>
    </div>
  </div>

  <script>
    const FUNCTION_BASE = 'https://mmnwbkbipjnmsvtyohjg.supabase.co/functions/v1';
    const STATUS_POLL_INTERVAL_MS = 1000;
    const STATUS_SETTLE_MS = 5000;

    const params         = new URLSearchParams(location.search);
    const userId         = params.get('user_id');
    const pageId         = params.get('page_id');
    const searching      = params.get('searching') === '1';
    const presetKeyword  = params.get('keyword');

    const btn         = document.getElementById('searchBtn');
    const status      = document.getElementById('status');
    const configGuide = document.getElementById('configGuide');
    const form        = document.getElementById('form');
    const keywordEl   = document.getElementById('keyword');
    const periodEl    = document.getElementById('period');
    const periodBtns  = [...document.querySelectorAll('#periods .segment-btn')];
    const chipsEl     = document.getElementById('platforms');
    const allPlatformsBtn = document.getElementById('allPlatformsBtn');


    const configured = !!(userId && pageId);

    if (presetKeyword) keywordEl.value = presetKeyword;

    // ── 기간/매체 선택 ──────────────────────────────────────────────────────
    function setPeriod(value) {
      periodEl.value = value;
      periodBtns.forEach((button) => {
        const active = button.dataset.value === value;
        button.classList.toggle('active', active);
        button.setAttribute('aria-checked', String(active));
      });
    }

    periodBtns.forEach((button) => {
      button.addEventListener('click', () => setPeriod(button.dataset.value));
    });

    chipsEl.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      chip.classList.toggle('active');
      chip.setAttribute('aria-pressed', String(chip.classList.contains('active')));
    });

    allPlatformsBtn.addEventListener('click', () => {
      chipsEl.querySelectorAll('.chip').forEach((chip) => {
        chip.classList.add('active');
        chip.setAttribute('aria-pressed', 'true');
      });
    });

    function selectedPlatforms() {
      return [...chipsEl.querySelectorAll('.chip.active')].map((c) => c.dataset.value);
    }

    async function setEmbedSearching(searching) {
      try {
        await fetch(FUNCTION_BASE + '/manage-user?action=set-search-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, searching }),
        });
      } catch { /* 임베드 URL 상태 갱신 실패는 검색 자체를 막지 않음 */ }
    }

    // ── 초기 상태 렌더링 ─────────────────────────────────────────────────────
    if (!configured) {
      btn.classList.add('unconfigured');
      form.classList.add('disabled-overlay');
      configGuide.style.display = 'block';
    } else if (searching) {
      // URL에 ?searching=1 → 다른 기기/새 탭에서 진행 중인 검색 표시
      btn.disabled = true;
      btn.classList.add('searching');
      btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
      form.classList.add('disabled-overlay');
      status.className = 'searching';
      status.textContent = '노션에서 검색 결과를 작성하고 있어요...';
    }

    // ── 버튼 클릭 ────────────────────────────────────────────────────────────
    btn.addEventListener('click', async () => {
      if (!configured) return;
      if (btn.disabled) return;

      const keyword   = keywordEl.value.trim();
      const platforms = selectedPlatforms();
      const period    = periodEl.value;

      // 클라이언트 검증
      if (!keyword) {
        status.className = 'error';
        status.textContent = '검색 키워드를 입력해주세요.';
        keywordEl.focus();
        return;
      }
      if (platforms.length === 0) {
        status.className = 'error';
        status.textContent = '하나 이상의 매체를 선택해주세요.';
        return;
      }

      // 1. 즉시 UI 비활성
      document.getElementById('keywordTrend').style.display = 'none';
      document.getElementById('relatedSection').style.display = 'none';
      btn.disabled = true;
      btn.classList.add('searching');
      btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
      form.classList.add('disabled-overlay');
      status.className = 'searching';
      status.textContent = '검색을 요청하고 있어요...';
      activeSearch = true;

      try {
        // 2. 검색 트리거 — DB 검색 상태가 먼저 잡힌 뒤 임베드 URL을 갱신한다.
        const res = await fetch(FUNCTION_BASE + '/trigger-search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            notion_page_id: pageId,
            keyword,
            platforms,
            period,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.userMessage || data.message || '검색 요청에 실패했습니다.');

        // 202 수신 — 다른 기기/새 탭 차단용 URL 갱신 후 폴링으로 완료 감지
        setEmbedSearching(true);
        status.textContent = '노션에서 검색 결과를 작성하고 있어요...';
        startPolling();

      } catch (err) {
        await setEmbedSearching(false);
        activeSearch = false;
        stopPolling();
        resetButton();
        status.className = 'error';
        status.textContent = err.message;
      }
    });

    // ── 완료 폴링 ────────────────────────────────────────────────────────────
    let pollTimer = null;
    let activeSearch = false;

    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }

    function startPolling(options = {}) {
      activeSearch = true;
      stopPolling();

      let attempts = 0;
      let sawSearching = false;
      const startedAt = Date.now();
      const minWaitMs = options.minWaitMs ?? STATUS_SETTLE_MS;
      const MAX = 120; // 120 × 1s = 최대 2분

      pollTimer = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch(
            `${FUNCTION_BASE}/manage-user?action=get-search-status&user_id=${userId}`
          );
          if (!res.ok) return;
          const data = await res.json();
          if (data.searching) {
            sawSearching = true;
            if (data.message) status.textContent = data.message;
          } else if (!sawSearching && Date.now() - startedAt < minWaitMs) {
            status.className = 'searching';
            status.textContent = '검색 상태를 확인하고 있어요...';
          } else {
            stopPolling();
            activeSearch = false;
            resetButton();
            if (data.error) {
              status.className = 'error';
              status.textContent = data.error;
            } else {
              status.className = 'accepted';
              status.textContent = '검색 완료! 노션에서 결과를 확인하세요.';
              showKeywordTrend(keywordEl.value.trim());
              if (data.related?.keywords?.length) showRelatedKeywords(data.related);
            }
            return;
          }
        } catch { /* 일시적 네트워크 오류 무시 */ }

        if (attempts >= MAX) {
          stopPolling();
          activeSearch = false;
          resetButton();
          status.className = 'error';
          status.textContent = '시간이 초과됐어요. 노션을 직접 확인해주세요.';
        }
      }, STATUS_POLL_INTERVAL_MS);
    }

    function resetButton() {
      btn.disabled = false;
      btn.classList.remove('searching');
      btn.innerHTML = '검색하기';
      form.classList.remove('disabled-overlay');
    }

    // 페이지 로드 시 한 번 즉시 상태 확인 — URL 파라미터가 스테일할 수 있으므로 API가 기준
    // API 실패 시 검색중 아님으로 간주(fail-safe) — UI가 영구 잠금되는 것 방지
    if (configured) (async () => {
      let isSearching = false;
      try {
        const res = await fetch(`${FUNCTION_BASE}/manage-user?action=get-search-status&user_id=${userId}`);
        if (res.ok) {
          const data = await res.json();
          isSearching = !!data.searching;
        }
      } catch { /* 네트워크 오류 → isSearching = false 유지 */ }

      if (activeSearch) return;

      if (isSearching && !pollTimer) {
        btn.disabled = true;
        btn.classList.add('searching');
        btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
        form.classList.add('disabled-overlay');
        status.className = 'searching';
        status.textContent = '노션에서 검색 결과를 작성하고 있어요...';
        startPolling();
      } else if (!isSearching) {
        stopPolling();
        resetButton();
        if (searching) {
          btn.disabled = true;
          btn.classList.add('searching');
          btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
          form.classList.add('disabled-overlay');
          status.className = 'searching';
          status.textContent = '검색 상태를 확인하고 있어요...';
          startPolling({ minWaitMs: STATUS_SETTLE_MS });
        }
      }
    })();

    // ── 자동완성 ─────────────────────────────────────────────────────────────
    const suggestEl = document.getElementById('suggest');
    let suggestItems = [];
    let activeIdx = -1;
    let suggestTimer = null;
    let lastQuery = '';

    function closeSuggest() {
      suggestEl.classList.remove('open');
      suggestEl.innerHTML = '';
      suggestItems = [];
      activeIdx = -1;
    }

    function renderSuggest(words) {
      if (!words.length) { closeSuggest(); return; }
      suggestItems = words;
      activeIdx = -1;
      suggestEl.innerHTML = '';
      words.forEach((w) => {
        const item = document.createElement('div');
        item.className = 'suggest-item';
        item.innerHTML = '<span class="ico">🔍</span>';
        item.appendChild(document.createTextNode(w));
        item.addEventListener('mousedown', (e) => {
          e.preventDefault(); // blur 먼저 발생 방지
          keywordEl.value = w;
          closeSuggest();
          keywordEl.focus();
        });
        suggestEl.appendChild(item);
      });
      suggestEl.classList.add('open');
    }

    async function fetchSuggest(q) {
      try {
        const res = await fetch(
          `${FUNCTION_BASE}/manage-user?action=trend-suggest&keyword=${encodeURIComponent(q)}`
        );
        if (!res.ok) return;
        const data = await res.json();
        if (keywordEl.value.trim() === q) renderSuggest(data.suggestions || []);
      } catch { /* 자동완성 실패는 무시 */ }
    }

    function highlight(delta) {
      if (!suggestItems.length) return;
      const items = suggestEl.querySelectorAll('.suggest-item');
      if (activeIdx >= 0) items[activeIdx]?.classList.remove('active');
      activeIdx = (activeIdx + delta + suggestItems.length) % suggestItems.length;
      items[activeIdx]?.classList.add('active');
    }

    keywordEl.addEventListener('input', () => {
      const q = keywordEl.value.trim();
      if (q === lastQuery) return;
      lastQuery = q;
      clearTimeout(suggestTimer);
      if (q.length < 1) { closeSuggest(); return; }
      suggestTimer = setTimeout(() => fetchSuggest(q), 200);
    });

    keywordEl.addEventListener('keydown', (e) => {
      const open = suggestEl.classList.contains('open');
      if (open && e.key === 'ArrowDown') { e.preventDefault(); highlight(1); return; }
      if (open && e.key === 'ArrowUp')   { e.preventDefault(); highlight(-1); return; }
      if (e.key === 'Enter') {
        if (open && activeIdx >= 0) {
          e.preventDefault();
          keywordEl.value = suggestItems[activeIdx];
          closeSuggest();
          return;
        }
        btn.click();
        return;
      }
      if (e.key === 'Escape') closeSuggest();
    });

    keywordEl.addEventListener('blur', () => setTimeout(closeSuggest, 120));

    async function showKeywordTrend(keyword) {
      if (!keyword) return;
      try {
        const res = await fetch(
          `${FUNCTION_BASE}/trend-data?action=keyword&keyword=${encodeURIComponent(keyword)}`
        );
        if (!res.ok) return;
        const data = await res.json();
        if (!data.trend) return;

        const { direction, changePercent, points } = data.trend;
        const sparkline = toSparkline(points.map((p) => p.ratio));
        const arrow = direction === 'up' ? '📈' : direction === 'down' ? '📉' : '➡️';
        const changeText =
          direction === 'up' ? `+${changePercent}%` :
          direction === 'down' ? `${changePercent}%` : '보합';

        const el = document.getElementById('keywordTrend');
        el.innerHTML =
          `${arrow} <strong>'${keyword}'</strong> 검색량 ${changeText} (최근 2주)<br>` +
          `<span style="font-family:monospace;letter-spacing:3px;font-size:1rem">${sparkline}</span>`;
        el.style.display = 'block';
      } catch { /* 트렌드 표시 실패는 무시 */ }
    }

    function showRelatedKeywords(related) {
      const section = document.getElementById('relatedSection');
      const chips = document.getElementById('relatedChips');
      chips.innerHTML = '';
      related.keywords.forEach(({ keyword, ratio }) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'related-chip';
        chip.innerHTML = `${keyword}<span class="ratio">${ratio}</span>`;
        chip.addEventListener('click', () => {
          keywordEl.value = keyword;
          section.style.display = 'none';
          keywordEl.focus();
        });
        chips.appendChild(chip);
      });
      section.style.display = 'block';
    }

    function toSparkline(values) {
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;
      const chars = '▁▂▃▄▅▆▇█';
      return values.slice(-12).map((v) => chars[Math.round((v - min) / range * 7)]).join('');
    }
  </script>
</body>
</html>
