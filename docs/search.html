<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy 검색</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #ffffff;
      --paper-soft: #f7f7f5;
      --ink: #37352f;
      --muted: rgba(55, 53, 47, 0.62);
      --line: rgba(55, 53, 47, 0.16);
      --line-strong: rgba(55, 53, 47, 0.26);
      --accent: #37352f;
      --accent-soft: rgba(55, 53, 47, 0.08);
      --ok: #448361;
      --ok-soft: #edf3ec;
      --warn: #a76a1f;
      --warn-soft: #fbf3db;
      --danger: #d44c47;
      --danger-soft: #fdebec;
      /* 고정 반응형 높이 — 브레이크포인트별로 아래 미디어쿼리에서 재정의 */
      --embed-height: 300px;
    }

    html {
      min-height: var(--embed-height);
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      background: transparent;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: var(--embed-height);
      padding: 8px clamp(8px, 2vw, 16px);
      overflow-x: hidden;
      overflow-y: visible;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .search-shell {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 1040px;
      min-height: var(--embed-height);
      min-width: 0;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 14px;
      width: 100%;
      flex: 0 0 var(--embed-height);
      height: var(--embed-height);
      min-height: 0;
      padding: 8px 16px;
      border: 1px solid rgba(55, 53, 47, 0.12);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04), 0 6px 20px -12px rgba(15, 15, 15, 0.16);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    /* ── 입력 필드 ── */
    .field { display: flex; flex-direction: column; gap: 7px; }
    .label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0;
    }
    .keyword-composer {
      position: relative;
      min-width: 0;
    }
    .keyword-shell {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 36px;
      gap: 8px;
      align-items: center;
      padding: 0 8px 0 13px;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .keyword-shell:hover {
      border-color: var(--line-strong);
      background: rgba(55, 53, 47, 0.02);
    }
    .keyword-shell:focus-within {
      border-color: var(--line-strong);
      background: var(--paper-soft);
      box-shadow: 0 0 0 2px rgba(55, 53, 47, 0.08);
    }
    .keyword-shell.is-invalid {
      border-color: var(--danger);
      background: var(--danger-soft);
      box-shadow: 0 0 0 2px rgba(212, 76, 71, 0.10);
    }
    .keyword-shell.has-value .keyword-icon {
      color: var(--ink);
    }
    .keyword-shell.is-invalid .keyword-icon {
      color: var(--danger);
    }
    .keyword-icon {
      width: 18px;
      height: 18px;
      color: rgba(55, 53, 47, 0.42);
    }
    .keyword-icon svg,
    .keyword-clear svg,
    .button-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #keyword {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      border: 0;
      outline: 0;
      padding: 0;
      font-size: 0.95rem;
      line-height: 1.35;
      font-family: inherit;
      color: var(--ink);
      background: transparent;
    }
    #keyword:focus {
      outline: none;
    }
    #keyword::placeholder {
      color: rgba(55, 53, 47, 0.38);
    }
    .keyword-clear {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .keyword-clear svg { width: 16px; height: 16px; }
    .keyword-shell.has-value .keyword-clear {
      opacity: 1;
      pointer-events: auto;
    }
    .keyword-clear:hover {
      background: rgba(55, 53, 47, 0.08);
      color: var(--ink);
    }
    .suggestions {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 0;
      padding-top: 2px;
    }
    .suggestions.open {
      display: flex;
      max-height: 76px;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    .suggestion-item {
      max-width: 100%;
      min-height: 32px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper-soft);
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .suggestion-item:hover,
    .suggestion-item.active {
      border-color: var(--line-strong);
      background: rgba(55, 53, 47, 0.08);
      color: var(--ink);
    }
    .suggestion-more {
      border-color: rgba(55, 53, 47, 0.22);
      background: #fff;
      color: var(--ink);
      font-weight: 700;
    }
    .suggestion-icon {
      width: 14px;
      height: 14px;
      color: rgba(55, 53, 47, 0.44);
      flex: 0 0 auto;
    }
    .suggestion-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .suggestion-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .keyword-clear:focus-visible,
    .suggestion-item:focus-visible,
    .segment-btn:focus-visible,
    .chip:focus-visible,
    .mini-action:focus-visible,
    #searchBtn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: minmax(180px, 0.72fr) minmax(0, 1.28fr);
      gap: 12px;
      align-items: start;
      min-width: 0;
    }

    .filter-field {
      min-width: 0;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .label-with-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .selection-count {
      min-width: 42px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper-soft);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
    }

    .platform-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      margin-left: auto;
    }

    .platform-toggle { display: none; }

    .segmented {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper-soft);
    }

    .segment-btn {
      min-width: 0;
      min-height: 44px;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
      white-space: nowrap;
    }

    .segment-btn:hover:not(.active) { color: var(--ink); background: rgba(55, 53, 47, 0.06); }
    .segment-btn.active {
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.10), 0 0 0 1px rgba(55, 53, 47, 0.06);
    }

    .chip {
      padding: 8px 12px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .chip:hover { border-color: var(--line-strong); background: rgba(55, 53, 47, 0.04); }
    .chip.active {
      background: var(--accent-soft);
      border-color: var(--line-strong);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(55, 53, 47, 0.08);
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .platform-grid.is-invalid .platform-chip {
      border-color: rgba(185, 28, 28, 0.42);
      background: #fffafa;
    }

    .platform-chip {
      min-width: 0;
      min-height: 44px;
      padding: 8px 9px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.2;
      position: relative;
      width: 100%;
      overflow: hidden;
      container-type: inline-size;
      container-name: platform-chip;
    }

    .platform-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: rgba(55, 53, 47, 0.50);
    }
    .platform-icon svg {
      width: 16px;
      height: 16px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .platform-chip.active .platform-icon { color: currentColor; }
    .platform-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .platform-check {
      width: 9px;
      margin-left: 1px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      opacity: 0;
    }
    .platform-chip.active .platform-check { opacity: 1; }

    @container platform-chip (max-width: 96px) {
      .platform-label,
      .platform-check {
        display: none;
      }
    }

    .mini-action {
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      min-height: 40px;
      padding: 7px 9px;
    }
    .mini-action:hover { background: rgba(55, 53, 47, 0.08); border-color: transparent; color: var(--ink); }

    /* ── 버튼 ── */
    #searchBtn {
      width: clamp(52px, 24vw, 124px);
      min-width: 52px;
      min-height: 50px;
      padding: 12px 14px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.18);
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      container-type: inline-size;
      container-name: search-button;
    }
    #searchBtn:active:not(:disabled) { transform: translateY(0.5px); }
    .button-icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }
    .search-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @container search-button (max-width: 96px) {
      .search-label {
        display: none;
      }
    }
    #searchBtn:hover:not(:disabled) { background: #2f2d29; }
    #searchBtn:disabled { background: rgba(55, 53, 47, 0.16); color: rgba(55, 53, 47, 0.42); cursor: not-allowed; box-shadow: none; }
    #searchBtn.searching { background: rgba(55, 53, 47, 0.54); cursor: not-allowed; color: #fff; }
    #searchBtn.unconfigured { background: rgba(55, 53, 47, 0.10); color: rgba(55, 53, 47, 0.32); cursor: not-allowed; pointer-events: auto; }

    /* ── 상태 메시지 ── */
    .message {
      width: 100%;
      padding: 12px 13px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.45;
      text-align: left;
      display: none;
      font-weight: 500;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .notice-zone {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      overflow: visible;
    }

    #status.message.searching,
    #status.message.accepted,
    #status.message.error,
    .config-guide.visible {
      display: grid;
    }

    .message-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      color: currentColor;
    }
    .message-icon svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .message-icon.is-loading::before {
      content: "";
      width: 15px;
      height: 15px;
      border: 2px solid rgba(55, 53, 47, 0.18);
      border-top-color: var(--ink);
      border-radius: 999px;
      animation: spin 0.75s linear infinite;
    }
    .message-title {
      display: block;
      color: var(--ink);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .message-description {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.45;
    }
    .message-link {
      color: var(--warn);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .message-link:hover { text-decoration: underline; text-underline-offset: 2px; }

    .message.searching {
      background: var(--accent-soft);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .message.accepted {
      background: var(--ok-soft);
      color: var(--ok);
      border: 1px solid rgba(68, 131, 97, 0.24);
    }
    .message.error {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(212, 76, 71, 0.24);
    }
    .message.accepted .message-title,
    .message.error .message-title {
      color: currentColor;
    }

    /* ── 설정 안내 (파라미터 없을 때) ── */
    .config-guide {
      background: var(--warn-soft);
      border: 1px solid rgba(167, 106, 31, 0.22);
      color: var(--warn);
    }
    .config-guide .message-title {
      color: var(--warn);
    }

    .field-error {
      display: none;
      color: var(--danger);
      font-size: 0.76rem;
      line-height: 1.45;
    }
    .field-error.visible { display: block; }


    #form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      min-width: 0;
    }

    @media (min-width: 621px) {
      :root { --embed-height: 300px; }

      .filter-field .label-row {
        min-height: 40px;
      }

      .filter-grid {
        grid-template-columns: minmax(190px, 0.54fr) minmax(0, 1.46fr);
      }

      .platform-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .search-row {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      #searchBtn {
        width: clamp(52px, 16vw, 132px);
      }
    }

    @media (max-width: 620px) {
      :root { --embed-height: 420px; }

      .filter-grid { grid-template-columns: 1fr; }
      .label-row {
        flex-wrap: wrap;
        row-gap: 4px;
      }
      .platform-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .disabled-overlay { opacity: 0.56; pointer-events: none; filter: grayscale(0.18); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.46);
      border-top-color: #fff;
      border-radius: 999px;
      animation: spin 0.7s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="search-shell">
    <div class="wrap">
      <div id="form">
        <div class="filter-grid">
        <div class="field filter-field period-field">
          <div class="label-row">
            <span class="label" id="periodLabel">기간</span>
          </div>
          <div class="segmented" id="periods" role="radiogroup" aria-labelledby="periodLabel">
            <button type="button" class="segment-btn" data-value="day" role="radio" aria-checked="false">1일</button>
            <button type="button" class="segment-btn" data-value="week" role="radio" aria-checked="false">1주</button>
            <button type="button" class="segment-btn active" data-value="month" role="radio" aria-checked="true">1개월</button>
            <button type="button" class="segment-btn" data-value="year" role="radio" aria-checked="false">1년</button>
          </div>
          <input id="period" type="hidden" value="month">
        </div>

        <div class="field filter-field platform-field">
          <div class="label-row">
            <span class="label label-with-count" id="platformsLabel">
              매체
              <span class="selection-count" id="platformCount" aria-live="polite">모두 선택됨</span>
            </span>
            <span class="platform-actions">
              <button type="button" class="mini-action platform-toggle" id="platformToggleBtn" aria-controls="platforms" aria-expanded="false">펼치기</button>
              <button type="button" class="mini-action" id="allPlatformsBtn">전체 해제</button>
            </span>
          </div>
          <div class="platform-grid is-collapsed" id="platforms" aria-labelledby="platformsLabel">
            <button type="button" class="chip platform-chip active" data-value="naver_blog" aria-pressed="true" aria-label="네이버" title="네이버">
              <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 6h10v12H7z"></path><path d="M10 9h4"></path><path d="M10 12h4"></path><path d="M10 15h3"></path></svg></span>
              <span class="platform-label">네이버</span>
              <span class="platform-check" aria-hidden="true">✓</span>
            </button>
            <button type="button" class="chip platform-chip active" data-value="youtube" aria-pressed="true" aria-label="유튜브" title="유튜브">
              <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 8.5c0-1.4 1-2.5 2.4-2.6 1.4-.1 3-.2 4.6-.2s3.2.1 4.6.2C18 6 19 7.1 19 8.5v7c0 1.4-1 2.5-2.4 2.6-1.4.1-3 .2-4.6.2s-3.2-.1-4.6-.2C6 18 5 16.9 5 15.5z"></path><path d="m10.5 9.5 4 2.5-4 2.5z"></path></svg></span>
              <span class="platform-label">유튜브</span>
              <span class="platform-check" aria-hidden="true">✓</span>
            </button>
            <button type="button" class="chip platform-chip active" data-value="youtube_shorts" aria-pressed="true" aria-label="숏츠" title="숏츠">
              <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m10 5 6 3-6 3z"></path><path d="m14 13-6 3 6 3z"></path><path d="M7 7.5v9"></path><path d="M17 7.5v9"></path></svg></span>
              <span class="platform-label">숏츠</span>
              <span class="platform-check" aria-hidden="true">✓</span>
            </button>
            <button type="button" class="chip platform-chip active" data-value="tistory" aria-pressed="true" aria-label="티스토리" title="티스토리">
              <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 7h12"></path><path d="M12 7v10"></path><path d="M9 17h6"></path></svg></span>
              <span class="platform-label">티스토리</span>
              <span class="platform-check" aria-hidden="true">✓</span>
            </button>
            <button type="button" class="chip platform-chip active" data-value="brunch" aria-pressed="true" aria-label="브런치" title="브런치">
              <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 6h5a3 3 0 0 1 0 6H8z"></path><path d="M8 12h6a3 3 0 0 1 0 6H8z"></path></svg></span>
              <span class="platform-label">브런치</span>
              <span class="platform-check" aria-hidden="true">✓</span>
            </button>
            <button type="button" class="chip platform-chip active" data-value="tiktok" aria-pressed="true" aria-label="틱톡" title="틱톡">
              <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 5v9.5a3.5 3.5 0 1 1-3.5-3.5"></path><path d="M14 7c1 2 2.4 3.2 4.5 3.5"></path></svg></span>
              <span class="platform-label">틱톡</span>
              <span class="platform-check" aria-hidden="true">✓</span>
            </button>
            <button type="button" class="chip platform-chip active" data-value="instagram_reels" aria-pressed="true" aria-label="릴스" title="릴스">
              <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="14" rx="3"></rect><path d="m11 10 4 2-4 2z"></path><path d="M8 8h8"></path></svg></span>
              <span class="platform-label">릴스</span>
              <span class="platform-check" aria-hidden="true">✓</span>
            </button>
          </div>
          <div class="field-error" id="platformError"></div>
        </div>
      </div>

      <div class="field keyword-field">
        <label class="label" for="keyword">키워드</label>
        <div class="search-row">
          <div class="keyword-composer">
            <div class="keyword-shell" id="keywordShell">
              <span class="keyword-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="6"></circle>
                  <path d="m16 16 4 4"></path>
                </svg>
              </span>
              <input id="keyword" type="text" placeholder="검색할 단어를 입력하세요" maxlength="100" autocomplete="off" enterkeyhint="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="keywordSuggest" aria-describedby="keywordError">
              <button type="button" class="keyword-clear" id="keywordClearBtn" aria-label="키워드 지우기">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 6 6 18"></path>
                  <path d="m6 6 12 12"></path>
                </svg>
              </button>
            </div>
          </div>
          <button id="searchBtn" type="button" aria-label="검색하기">
            <span class="button-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="m16 16 4 4"></path>
              </svg>
            </span>
            <span class="search-label">검색하기</span>
          </button>
        </div>
        <div class="suggestions" id="keywordSuggest" role="listbox" aria-label="추천 키워드"></div>
        <div class="field-error" id="keywordError"></div>
      </div>
      </div>
    </div>

    <div class="notice-zone" aria-label="알림">
      <div id="status" class="message" role="status" aria-live="polite"></div>
      <div class="message config-guide" id="configGuide">
        <span class="message-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 11v5"></path>
            <path d="M12 8h.01"></path>
          </svg>
        </span>
        <span class="message-body">
          <span class="message-title">셋업 필요</span>
          <span class="message-description">
            셋업을 완료하면 검색하기 버튼이 활성화됩니다.
            <a class="message-link" href="https://pchanul.github.io/Snappy/" target="_blank" rel="noopener">시작하기</a>
          </span>
        </span>
      </div>
    </div>
  </div>

  <script>
    const FUNCTION_BASE = 'https://mmnwbkbipjnmsvtyohjg.supabase.co/functions/v1';
    const STATUS_POLL_INTERVAL_MS = 1000;
    const STATUS_SETTLE_MS = 5000;

    const params         = new URLSearchParams(location.search);
    const userId         = params.get('user_id');
    const pageId         = params.get('page_id');
    const searching      = params.get('searching') === '1';
    const presetKeyword  = params.get('keyword');

    const btn         = document.getElementById('searchBtn');
    const status      = document.getElementById('status');
    const configGuide = document.getElementById('configGuide');
    const form        = document.getElementById('form');
    const keywordEl   = document.getElementById('keyword');
    const keywordShell = document.getElementById('keywordShell');
    const keywordClearBtn = document.getElementById('keywordClearBtn');
    const keywordSuggest = document.getElementById('keywordSuggest');
    const periodEl    = document.getElementById('period');
    const periodBtns  = [...document.querySelectorAll('#periods .segment-btn')];
    const chipsEl     = document.getElementById('platforms');
    const allPlatformsBtn = document.getElementById('allPlatformsBtn');
    const platformCount = document.getElementById('platformCount');
    const platformToggleBtn = document.getElementById('platformToggleBtn');
    const keywordError = document.getElementById('keywordError');
    const platformError = document.getElementById('platformError');
    const PREFERENCE_KEY = 'snappy.search.preferences.v3';
    const LEGACY_PREFERENCE_KEY = 'snappy.search.preferences.v1';
    const SUGGEST_MIN_LENGTH = 2;
    const SUGGEST_DEBOUNCE_MS = 250;
    const SUGGEST_INITIAL_LIMIT = 5;
    const SUGGEST_MAX_RESULTS = 20;
    let platformsExpanded = false;
    let suggestTimer = null;
    let suggestAbortController = null;
    let suggestItems = [];
    let activeSuggestIndex = -1;
    let lastSuggestQuery = '';
    let suggestRequestSeq = 0;
    let suggestionsExpanded = false;


    const configured = !!(userId && pageId);

    if (presetKeyword) keywordEl.value = presetKeyword;

    const SEARCH_BUTTON_ICON = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>';

    // ── 기간/매체 선택 ──────────────────────────────────────────────────────
    function setPeriod(value, options = {}) {
      periodEl.value = value;
      periodBtns.forEach((button) => {
        const active = button.dataset.value === value;
        button.classList.toggle('active', active);
        button.setAttribute('aria-checked', String(active));
        button.tabIndex = active ? 0 : -1;
      });
      if (options.persist !== false) savePreferences();
    }

    periodBtns.forEach((button) => {
      button.addEventListener('click', () => setPeriod(button.dataset.value));
      button.addEventListener('keydown', (e) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
        e.preventDefault();
        const currentIndex = periodBtns.findIndex((item) => item === button);
        const nextIndex =
          e.key === 'Home' ? 0 :
          e.key === 'End' ? periodBtns.length - 1 :
          e.key === 'ArrowLeft' ? (currentIndex - 1 + periodBtns.length) % periodBtns.length :
          (currentIndex + 1) % periodBtns.length;
        const next = periodBtns[nextIndex];
        setPeriod(next.dataset.value);
        next.focus();
      });
    });

    chipsEl.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      chip.classList.toggle('active');
      chip.setAttribute('aria-pressed', String(chip.classList.contains('active')));
      updatePlatformMeta();
      savePreferences();
    });

    allPlatformsBtn.addEventListener('click', () => {
      const chips = [...chipsEl.querySelectorAll('.chip')];
      const shouldSelectAll = selectedPlatforms().length !== chips.length;
      chips.forEach((chip) => setPlatformChip(chip, shouldSelectAll));
      updatePlatformMeta();
      savePreferences();
    });

    function selectedPlatforms() {
      return [...chipsEl.querySelectorAll('.chip.active')].map((c) => c.dataset.value);
    }

    function setPlatformChip(chip, active) {
      chip.classList.toggle('active', active);
      chip.setAttribute('aria-pressed', String(active));
    }

    function updatePlatformMeta() {
      const chips = [...chipsEl.querySelectorAll('.chip')];
      const count = selectedPlatforms().length;
      const allSelected = count === chips.length;
      platformCount.textContent = allSelected ? '모두 선택됨' : `${count}개 선택됨`;
      allPlatformsBtn.textContent = allSelected ? '전체 해제' : '전체 선택';
      allPlatformsBtn.setAttribute('aria-label', allSelected ? '모든 매체 선택 해제' : '모든 매체 선택');
      if (count > 0) clearValidation('platforms');
      updatePlatformToggleLabel();
    }

    function setPlatformPanelExpanded(expanded) {
      platformsExpanded = expanded;
      chipsEl.classList.toggle('is-collapsed', !expanded);
      updatePlatformToggleLabel();
    }

    function updatePlatformToggleLabel() {
      const count = selectedPlatforms().length;
      platformToggleBtn.textContent = platformsExpanded ? '접기' : `매체 ${count}개`;
      platformToggleBtn.setAttribute('aria-expanded', String(platformsExpanded));
    }

    function readPreferences() {
      try {
        const current = JSON.parse(localStorage.getItem(PREFERENCE_KEY) || '{}');
        if (Object.keys(current).length > 0) return current;

        const legacy = JSON.parse(localStorage.getItem(LEGACY_PREFERENCE_KEY) || '{}');
        return legacy?.period ? { period: legacy.period } : {};
      } catch {
        return {};
      }
    }

    function savePreferences() {
      try {
        localStorage.setItem(PREFERENCE_KEY, JSON.stringify({
          period: periodEl.value,
          platforms: selectedPlatforms(),
        }));
      } catch { /* localStorage 차단 환경에서는 기본값 유지 */ }
    }

    function restorePreferences() {
      const prefs = readPreferences();
      if (['day', 'week', 'month', 'year'].includes(prefs.period)) {
        setPeriod(prefs.period, { persist: false });
      } else {
        setPeriod(periodEl.value, { persist: false });
      }

      if (Array.isArray(prefs.platforms)) {
        const valid = new Set(prefs.platforms);
        const chips = [...chipsEl.querySelectorAll('.chip')];
        const hasAnyValid = chips.some((chip) => valid.has(chip.dataset.value));
        if (hasAnyValid) chips.forEach((chip) => setPlatformChip(chip, valid.has(chip.dataset.value)));
      }
      updatePlatformMeta();
    }

    const STATUS_ICONS = {
      accepted: '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg>',
      error: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>',
    };

    function createMessageIcon(type) {
      const icon = document.createElement('span');
      icon.className = type === 'searching' ? 'message-icon is-loading' : 'message-icon';
      icon.setAttribute('aria-hidden', 'true');
      if (STATUS_ICONS[type]) icon.innerHTML = STATUS_ICONS[type];
      return icon;
    }

    function setStatusMessage(type, title, description) {
      const body = document.createElement('span');
      body.className = 'message-body';

      const titleEl = document.createElement('span');
      titleEl.className = 'message-title';
      titleEl.textContent = title;
      body.append(titleEl);

      if (description) {
        const descriptionEl = document.createElement('span');
        descriptionEl.className = 'message-description';
        descriptionEl.textContent = description;
        body.append(descriptionEl);
      }

      status.className = `message ${type}`;
      status.replaceChildren(createMessageIcon(type), body);
    }

    function clearStatusMessage() {
      status.className = 'message';
      status.replaceChildren();
    }

    function setSearchError(message, title = '검색할 수 없어요') {
      setStatusMessage('error', title, message);
    }

    function setSearchSuccess(message = '검색 결과가 노션 페이지에 추가됐습니다.') {
      setStatusMessage('accepted', '완료됐어요', message);
    }

    function syncKeywordControls() {
      keywordShell.classList.toggle('has-value', keywordEl.value.trim().length > 0);
    }

    function resetSuggestionTokens() {
      suggestItems = [];
      activeSuggestIndex = -1;
      suggestionsExpanded = false;
      keywordSuggest.classList.remove('open');
      keywordSuggest.replaceChildren();
      keywordEl.setAttribute('aria-expanded', 'false');
      keywordEl.removeAttribute('aria-activedescendant');
    }

    function closeSuggestions() {
      if (suggestTimer) clearTimeout(suggestTimer);
      suggestTimer = null;
      if (suggestAbortController) suggestAbortController.abort();
      suggestAbortController = null;
      suggestRequestSeq++;
      resetSuggestionTokens();
    }

    function setActiveSuggestion(index) {
      const items = [...keywordSuggest.querySelectorAll('[role="option"]')];
      items.forEach((item, itemIndex) => {
        const active = itemIndex === index;
        item.classList.toggle('active', active);
        item.setAttribute('aria-selected', String(active));
      });
      activeSuggestIndex = index;
      if (index >= 0) {
        keywordEl.setAttribute('aria-activedescendant', `suggestion-${index}`);
      } else {
        keywordEl.removeAttribute('aria-activedescendant');
      }
    }

    function moveSuggestion(delta) {
      const optionCount = keywordSuggest.querySelectorAll('[role="option"]').length;
      if (!optionCount) return;
      const nextIndex =
        activeSuggestIndex < 0
          ? (delta > 0 ? 0 : optionCount - 1)
          : (activeSuggestIndex + delta + optionCount) % optionCount;
      setActiveSuggestion(nextIndex);
    }

    function applySuggestion(value) {
      keywordEl.value = value;
      clearValidation('keyword');
      syncKeywordControls();
      closeSuggestions();
      keywordEl.focus();
    }

    function renderSuggestions(words) {
      suggestItems = words;
      activeSuggestIndex = -1;
      keywordSuggest.replaceChildren();

      if (!words.length) {
        closeSuggestions();
        return;
      }

      const visibleWords = suggestionsExpanded ? words : words.slice(0, SUGGEST_INITIAL_LIMIT);
      visibleWords.forEach((word, index) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'suggestion-item suggestion-option';
        item.id = `suggestion-${index}`;
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', 'false');

        const icon = document.createElement('span');
        icon.className = 'suggestion-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.innerHTML = SEARCH_BUTTON_ICON;

        const text = document.createElement('span');
        text.className = 'suggestion-text';
        text.textContent = word;

        item.replaceChildren(icon, text);
        item.addEventListener('mousedown', (event) => event.preventDefault());
        item.addEventListener('click', () => applySuggestion(word));
        keywordSuggest.append(item);
      });

      if (!suggestionsExpanded && words.length > SUGGEST_INITIAL_LIMIT) {
        const more = document.createElement('button');
        more.type = 'button';
        more.className = 'suggestion-item suggestion-more';
        more.setAttribute('role', 'button');
        more.setAttribute('aria-label', `추천 키워드 ${words.length - SUGGEST_INITIAL_LIMIT}개 더 보기`);

        const icon = document.createElement('span');
        icon.className = 'suggestion-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>';

        const text = document.createElement('span');
        text.className = 'suggestion-text';
        text.textContent = `더보기 ${words.length - SUGGEST_INITIAL_LIMIT}개`;

        more.replaceChildren(icon, text);
        more.addEventListener('mousedown', (event) => event.preventDefault());
        more.addEventListener('click', () => {
          suggestionsExpanded = true;
          renderSuggestions(suggestItems);
        });
        keywordSuggest.append(more);
      }

      keywordSuggest.classList.add('open');
      keywordEl.setAttribute('aria-expanded', 'true');
    }

    function scheduleSuggestions() {
      const query = keywordEl.value.trim();
      if (suggestTimer) clearTimeout(suggestTimer);

      if (query.length < SUGGEST_MIN_LENGTH) {
        closeSuggestions();
        lastSuggestQuery = '';
        return;
      }
      if (query === lastSuggestQuery && suggestItems.length) return;

      if (query !== lastSuggestQuery) {
        if (suggestAbortController) suggestAbortController.abort();
        suggestAbortController = null;
        suggestRequestSeq++;
        resetSuggestionTokens();
      }

      suggestTimer = setTimeout(() => fetchSuggestions(query), SUGGEST_DEBOUNCE_MS);
    }

    async function fetchSuggestions(query) {
      suggestTimer = null;
      lastSuggestQuery = query;
      if (suggestAbortController) suggestAbortController.abort();
      suggestAbortController = new AbortController();
      const requestSeq = ++suggestRequestSeq;

      try {
        const response = await fetch(
          `${FUNCTION_BASE}/manage-user?action=trend-suggest&keyword=${encodeURIComponent(query)}&t=${Date.now()}`,
          { signal: suggestAbortController.signal }
        );
        if (!response.ok) return closeSuggestions();
        const data = await response.json();
        if (requestSeq !== suggestRequestSeq) return;
        if (keywordEl.value.trim() !== query) return;

        const normalized = [...new Set((data.suggestions || [])
          .map((item) => String(item).trim())
          .filter((item) => item && item !== query))]
          .slice(0, SUGGEST_MAX_RESULTS);
        suggestionsExpanded = false;
        renderSuggestions(normalized);
      } catch (error) {
        if (error?.name !== 'AbortError') closeSuggestions();
      }
    }

    function setReadyButton() {
      const icon = document.createElement('span');
      icon.className = 'button-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.innerHTML = SEARCH_BUTTON_ICON;
      btn.setAttribute('aria-label', '검색하기');
      btn.replaceChildren(icon, createButtonLabel('검색하기'));
    }

    function createButtonLabel(text) {
      const label = document.createElement('span');
      label.className = 'search-label';
      label.textContent = text;
      return label;
    }

    function showValidationError(message, target) {
      const title = target === 'keyword' ? '키워드를 확인해주세요' : '매체를 선택해주세요';
      setSearchError(message, title);
      if (target === 'keyword') {
        keywordEl.classList.add('is-invalid');
        keywordShell.classList.add('is-invalid');
        keywordError.textContent = message;
        keywordError.classList.add('visible');
      }
      if (target === 'platforms') {
        chipsEl.classList.add('is-invalid');
        platformError.textContent = message;
        platformError.classList.add('visible');
        setPlatformPanelExpanded(true);
        chipsEl.querySelector('.chip')?.focus();
      }
    }

    function clearValidation(target) {
      if (target === 'keyword') {
        keywordEl.classList.remove('is-invalid');
        keywordShell.classList.remove('is-invalid');
        keywordError.textContent = '';
        keywordError.classList.remove('visible');
      }
      if (target === 'platforms') {
        chipsEl.classList.remove('is-invalid');
        platformError.textContent = '';
        platformError.classList.remove('visible');
      }
      if (
        status.classList.contains('error') &&
        !keywordEl.classList.contains('is-invalid') &&
        !chipsEl.classList.contains('is-invalid')
      ) {
        clearStatusMessage();
      }
    }

    restorePreferences();
    setPlatformPanelExpanded(false);
    syncKeywordControls();

    platformToggleBtn.addEventListener('click', () => {
      setPlatformPanelExpanded(!platformsExpanded);
    });

    async function setEmbedSearching(searching) {
      try {
        await fetch(FUNCTION_BASE + '/manage-user?action=set-search-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, searching }),
        });
      } catch { /* 임베드 URL 상태 갱신 실패는 검색 자체를 막지 않음 */ }
    }

    function setSearchingButton(label = '진행 중') {
      const spinner = document.createElement('span');
      spinner.className = 'spinner';
      spinner.setAttribute('aria-hidden', 'true');
      btn.setAttribute('aria-label', label);
      btn.replaceChildren(spinner, createButtonLabel(label));
    }

    function setSearchProgress(message) {
      setStatusMessage('searching', '검색 중', message);
      btn.title = message;
    }

    // ── 초기 상태 렌더링 ─────────────────────────────────────────────────────
    if (!configured) {
      btn.classList.add('unconfigured');
      form.classList.add('disabled-overlay');
      configGuide.classList.add('visible');
    } else if (searching) {
      // URL에 ?searching=1 → 다른 기기/새 탭에서 진행 중인 검색 표시
      btn.disabled = true;
      btn.classList.add('searching');
      setSearchingButton();
      form.classList.add('disabled-overlay');
      setSearchProgress('노션에서 검색 결과를 작성하고 있어요...');
    }

    // ── 버튼 클릭 ────────────────────────────────────────────────────────────
    btn.addEventListener('click', async () => {
      if (!configured) return;
      if (btn.disabled) return;

      const keyword   = keywordEl.value.trim();
      const platforms = selectedPlatforms();
      const period    = periodEl.value;
      closeSuggestions();

      // 클라이언트 검증
      if (!keyword) {
        showValidationError('검색 키워드를 입력해주세요.', 'keyword');
        keywordEl.focus();
        return;
      }
      if (platforms.length === 0) {
        showValidationError('하나 이상의 매체를 선택해주세요.', 'platforms');
        return;
      }

      // 1. 즉시 UI 비활성
      clearValidation('keyword');
      clearValidation('platforms');
      savePreferences();
      btn.disabled = true;
      btn.classList.add('searching');
      setSearchingButton();
      form.classList.add('disabled-overlay');
      setSearchProgress('검색 요청을 보내고 있어요...');
      activeSearch = true;

      try {
        // 2. 검색 트리거 — DB 검색 상태가 먼저 잡힌 뒤 임베드 URL을 갱신한다.
        const res = await fetch(FUNCTION_BASE + '/trigger-search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            notion_page_id: pageId,
            keyword,
            platforms,
            period,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.userMessage || data.message || '검색 요청에 실패했습니다.');

        // 202 수신 — 다른 기기/새 탭 차단용 URL 갱신 후 폴링으로 완료 감지
        setEmbedSearching(true);
        setSearchProgress('노션에서 검색 결과를 작성하고 있어요...');
        startPolling();

      } catch (err) {
        await setEmbedSearching(false);
        activeSearch = false;
        stopPolling();
        resetButton();
        setSearchError(err.message);
      }
    });

    // ── 완료 폴링 ────────────────────────────────────────────────────────────
    let pollTimer = null;
    let activeSearch = false;

    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }

    function startPolling(options = {}) {
      activeSearch = true;
      stopPolling();

      let attempts = 0;
      let sawSearching = false;
      const startedAt = Date.now();
      const minWaitMs = options.minWaitMs ?? STATUS_SETTLE_MS;
      const MAX = 120; // 120 × 1s = 최대 2분

      pollTimer = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch(
            `${FUNCTION_BASE}/manage-user?action=get-search-status&user_id=${userId}`
          );
          if (!res.ok) return;
          const data = await res.json();
          if (data.searching) {
            sawSearching = true;
            if (data.message) setSearchProgress(data.message);
          } else if (!sawSearching && Date.now() - startedAt < minWaitMs) {
            setSearchProgress('검색 상태를 확인하고 있어요...');
          } else {
            stopPolling();
            activeSearch = false;
            resetButton();
            if (data.error) {
              setSearchError(data.error);
            } else {
              setSearchSuccess();
            }
            return;
          }
        } catch { /* 일시적 네트워크 오류 무시 */ }

        if (attempts >= MAX) {
          stopPolling();
          activeSearch = false;
          resetButton();
          setSearchError('시간이 초과됐어요. 노션을 직접 확인해주세요.');
        }
      }, STATUS_POLL_INTERVAL_MS);
    }

    function resetButton() {
      btn.disabled = false;
      btn.classList.remove('searching');
      setReadyButton();
      btn.title = '';
      form.classList.remove('disabled-overlay');
    }

    // 페이지 로드 시 한 번 즉시 상태 확인 — URL 파라미터가 스테일할 수 있으므로 API가 기준
    // API 실패 시 검색중 아님으로 간주(fail-safe) — UI가 영구 잠금되는 것 방지
    if (configured) (async () => {
      let isSearching = false;
      try {
        const res = await fetch(`${FUNCTION_BASE}/manage-user?action=get-search-status&user_id=${userId}`);
        if (res.ok) {
          const data = await res.json();
          isSearching = !!data.searching;
        }
      } catch { /* 네트워크 오류 → isSearching = false 유지 */ }

      if (activeSearch) return;

      if (isSearching && !pollTimer) {
        btn.disabled = true;
        btn.classList.add('searching');
        setSearchingButton();
        form.classList.add('disabled-overlay');
        setSearchProgress('노션에서 검색 결과를 작성하고 있어요...');
        startPolling();
      } else if (!isSearching) {
        stopPolling();
        resetButton();
        if (searching) {
          btn.disabled = true;
          btn.classList.add('searching');
          setSearchingButton();
          form.classList.add('disabled-overlay');
          setSearchProgress('검색 상태를 확인하고 있어요...');
          startPolling({ minWaitMs: STATUS_SETTLE_MS });
        }
      }
    })();

    keywordEl.addEventListener('input', () => {
      clearValidation('keyword');
      syncKeywordControls();
      scheduleSuggestions();
    });

    keywordEl.addEventListener('focus', () => {
      scheduleSuggestions();
    });

    keywordClearBtn.addEventListener('click', () => {
      keywordEl.value = '';
      clearValidation('keyword');
      syncKeywordControls();
      closeSuggestions();
      keywordEl.focus();
    });

    keywordEl.addEventListener('keydown', (e) => {
      const suggestionsOpen = keywordSuggest.classList.contains('open');
      if (suggestionsOpen && e.key === 'ArrowDown') {
        e.preventDefault();
        moveSuggestion(1);
        return;
      }
      if (suggestionsOpen && e.key === 'ArrowUp') {
        e.preventDefault();
        moveSuggestion(-1);
        return;
      }
      if (suggestionsOpen && e.key === 'Escape') {
        e.preventDefault();
        closeSuggestions();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (suggestionsOpen && activeSuggestIndex >= 0) {
          applySuggestion(suggestItems[activeSuggestIndex]);
          return;
        }
        btn.click();
      }
    });

    document.addEventListener('mousedown', (event) => {
      if (!event.target.closest('.keyword-field')) closeSuggestions();
    });
  </script>
</body>
</html>
