<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy 검색</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    /* ── 버튼 ── */
    #searchBtn {
      width: 100%;
      padding: 14px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    #searchBtn:hover:not(:disabled) { background: #4f46e5; transform: translateY(-1px); }
    #searchBtn:active:not(:disabled) { transform: translateY(0); }
    #searchBtn:disabled { background: #a5b4fc; cursor: not-allowed; }
    #searchBtn.searching { background: #818cf8; cursor: not-allowed; }
    #searchBtn.unconfigured { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; pointer-events: auto; }

    /* ── 상태 메시지 ── */
    #status {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      text-align: center;
      display: none;
    }
    #status.searching {
      display: block;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
    }
    #status.accepted {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    #status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* ── 설정 안내 (파라미터 없을 때) ── */
    .config-guide {
      width: 100%;
      padding: 12px 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.6;
      text-align: center;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="searchBtn">🚀 검색하기</button>
    <div id="status"></div>
    <div class="config-guide" id="configGuide">
      셋업을 완료하면 이 버튼이 활성화됩니다.<br>
      <a href="https://pchanul.github.io/Snappy/" target="_blank"
         style="color:#c2410c;font-weight:600;">시작하기 →</a>
    </div>
  </div>

  <script>
    const FUNCTION_BASE = 'https://mmnwbkbipjnmsvtyohjg.supabase.co/functions/v1';
    const SEARCH_TIMEOUT = 120_000; // 2분 — 대부분의 검색이 이 안에 완료됨

    const params  = new URLSearchParams(location.search);
    const userId  = params.get('user_id');
    const pageId  = params.get('page_id');

    const btn         = document.getElementById('searchBtn');
    const status      = document.getElementById('status');
    const configGuide = document.getElementById('configGuide');

    const storageKey = pageId ? `snappy_search_${pageId}` : null;

    // Safari/Firefox ITP 등 서드파티 iframe에서 storage가 차단될 수 있으므로 폴백
    // localStorage → sessionStorage → 메모리 변수 순서로 사용
    const store = (() => {
      for (const s of [localStorage, sessionStorage]) {
        try { s.setItem('__t', '1'); s.removeItem('__t'); return s; } catch {}
      }
      // 메모리 폴백 (리로드 시 복원 불가 — 그래도 탭 내 중복 클릭은 막음)
      const mem = {};
      return { getItem: k => mem[k] ?? null, setItem: (k, v) => { mem[k] = v; }, removeItem: k => { delete mem[k]; } };
    })();

    // ── 검색 중 상태 관리 ───────────────────────────────────────────────────
    function startSearching() {
      if (storageKey) store.setItem(storageKey, String(Date.now()));
      btn.disabled = true;
      btn.classList.add('searching');
      btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
      status.className = 'searching';
      status.textContent = '노션 페이지에서 키워드를 읽어오고 있어요...';
    }

    function stopSearching() {
      if (storageKey) store.removeItem(storageKey);
      btn.disabled = false;
      btn.classList.remove('searching');
      btn.innerHTML = '🚀 검색하기';
    }

    let autoResetTimer = null;

    function scheduleAutoReset(remaining) {
      clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(() => {
        stopSearching();
        status.className = '';
        status.textContent = '';
      }, remaining);
    }

    // ── 페이지 로드 시 진행 중이던 검색 복원 ────────────────────────────────
    const configured = !!(userId && pageId);
    if (!configured) {
      btn.classList.add('unconfigured');
    } else if (storageKey) {
      const saved = store.getItem(storageKey);
      if (saved) {
        const elapsed = Date.now() - Number(saved);
        if (elapsed < SEARCH_TIMEOUT) {
          startSearching();
          status.textContent = '노션에서 검색 결과를 작성하고 있어요...';
          scheduleAutoReset(SEARCH_TIMEOUT - elapsed);
        } else {
          store.removeItem(storageKey);
        }
      }
    }

    // ── 버튼 클릭 ────────────────────────────────────────────────────────────
    btn.addEventListener('click', async () => {
      if (!configured) {
        configGuide.style.display = 'block';
        return;
      }
      if (btn.disabled) return;

      startSearching();
      scheduleAutoReset(SEARCH_TIMEOUT);

      try {
        const res = await fetch(FUNCTION_BASE + '/trigger-search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, notion_page_id: pageId }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.userMessage || data.message || '검색 요청에 실패했습니다.');
        }

        // 202 수신 — 백그라운드 검색 진행 중, 버튼은 계속 비활성
        status.textContent = '노션에서 검색 결과를 작성하고 있어요...';

      } catch (err) {
        clearTimeout(autoResetTimer);
        stopSearching();
        status.className = 'error';
        status.textContent = err.message;
      }
    });
  </script>
</body>
</html>
