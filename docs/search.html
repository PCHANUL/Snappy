<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy — 검색하기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      color: #1a1a1a;
      padding: 16px;
    }

    .wrap {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.08);
      padding: 20px 22px;
      border-left: 4px solid #6366f1;
    }
    .wrap.running { border-left-color: #f59e0b; }
    .wrap.done    { border-left-color: #10b981; }
    .wrap.error   { border-left-color: #ef4444; }

    /* 키워드 입력 */
    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .kw-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }
    .kw-input:focus { border-color: #6366f1; }
    .kw-input:disabled { background: #f9fafb; }

    .btn-search {
      flex-shrink: 0;
      padding: 10px 18px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-search:hover:not(:disabled) { background: #4f46e5; }
    .btn-search:disabled { background: #a5b4fc; cursor: not-allowed; }

    /* 옵션 영역 */
    .options {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-start;
    }

    .opt-group { display: flex; flex-direction: column; gap: 5px; }
    .opt-label { font-size: 0.72rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.04em; }

    /* 플랫폼 체크박스 */
    .platform-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .platform-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1.5px solid #e5e7eb;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      user-select: none;
    }
    .platform-chip input { display: none; }
    .platform-chip.checked {
      border-color: #6366f1;
      background: #eef2ff;
      color: #4f46e5;
      font-weight: 600;
    }
    .platform-chip:hover { border-color: #a5b4fc; }

    /* 기간 / 개수 셀렉트 */
    select {
      padding: 5px 10px;
      border: 1.5px solid #e0e0e0;
      border-radius: 7px;
      font-size: 0.82rem;
      color: #374151;
      background: #fff;
      outline: none;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    select:focus { border-color: #6366f1; }
    select:disabled { background: #f9fafb; cursor: not-allowed; }

    /* 상태 메시지 */
    .status {
      margin-top: 14px;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 0.83rem;
      line-height: 1.5;
      display: none;
    }
    .status.show { display: block; }
    .status.running { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .status.done    { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .no-user {
      font-size: 0.88rem;
      color: #666;
      line-height: 1.6;
      padding: 4px 2px;
    }
    .no-user a { color: #6366f1; text-decoration: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      animation: spin 0.7s linear infinite;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const SUPABASE_URL = 'https://mmnwbkbipjnmsvtyohjg.supabase.co';
    const FUNCTION_BASE = SUPABASE_URL + '/functions/v1';

    const params = new URLSearchParams(location.search);
    const userId = params.get('user_id');

    const PLATFORMS = [
      { id: 'naver_blog', label: '📝 네이버' },
      { id: 'youtube',    label: '🎥 유튜브' },
      { id: 'tistory',    label: '📚 티스토리' },
      { id: 'brunch',     label: '✍️ 브런치' },
    ];

    const root = document.getElementById('root');

    if (!userId) {
      root.innerHTML = `
        <p class="no-user">
          검색 버튼을 사용하려면 URL에 <code>user_id</code>가 필요합니다.<br>
          <a href="https://pchanul.github.io/Snappy/" target="_blank">→ Snappy 설정 페이지로 이동</a>
        </p>`;
    } else {
      renderSearch();
    }

    function renderSearch() {
      root.innerHTML = `
        <div class="wrap" id="wrap">
          <div class="search-row">
            <input class="kw-input" id="kw" type="text" placeholder="키워드를 입력하세요" maxlength="100" autocomplete="off">
            <button class="btn-search" id="searchBtn" type="button">검색하기</button>
          </div>

          <div class="options">
            <div class="opt-group">
              <span class="opt-label">매체</span>
              <div class="platform-list" id="platformList">
                ${PLATFORMS.map(p => `
                  <label class="platform-chip checked" id="chip-${p.id}">
                    <input type="checkbox" value="${p.id}" checked>
                    ${p.label}
                  </label>`).join('')}
              </div>
            </div>

            <div class="opt-group">
              <span class="opt-label">기간</span>
              <select id="period">
                <option value="day">1일</option>
                <option value="week">1주</option>
                <option value="month" selected>1개월</option>
                <option value="year">1년</option>
              </select>
            </div>

            <div class="opt-group">
              <span class="opt-label">개수</span>
              <select id="count">
                <option value="5">5개</option>
                <option value="10" selected>10개</option>
                <option value="20">20개</option>
              </select>
            </div>
          </div>

          <div class="status" id="status"></div>
        </div>`;

      // 플랫폼 칩 토글
      document.getElementById('platformList').addEventListener('click', (e) => {
        const chip = e.target.closest('.platform-chip');
        if (!chip) return;
        const cb = chip.querySelector('input[type=checkbox]');
        cb.checked = !cb.checked;
        chip.classList.toggle('checked', cb.checked);
      });

      document.getElementById('searchBtn').addEventListener('click', runSearch);
      document.getElementById('kw').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') runSearch();
      });
    }

    function setFormDisabled(disabled) {
      document.getElementById('kw').disabled = disabled;
      document.getElementById('searchBtn').disabled = disabled;
      document.getElementById('period').disabled = disabled;
      document.getElementById('count').disabled = disabled;
      document.querySelectorAll('.platform-chip input').forEach(cb => {
        cb.closest('.platform-chip').style.pointerEvents = disabled ? 'none' : '';
      });
    }

    function showStatus(type, html) {
      const el = document.getElementById('status');
      const wrap = document.getElementById('wrap');
      el.className = `status show ${type}`;
      el.innerHTML = html;
      wrap.className = `wrap ${type}`;
    }

    async function runSearch() {
      const keyword = document.getElementById('kw').value.trim();
      if (!keyword) {
        showStatus('error', '키워드를 입력해주세요.');
        return;
      }

      const platforms = [...document.querySelectorAll('.platform-chip input:checked')]
        .map(cb => cb.value);
      if (platforms.length === 0) {
        showStatus('error', '하나 이상의 매체를 선택해주세요.');
        return;
      }

      const period = document.getElementById('period').value;
      const result_count = Number(document.getElementById('count').value);

      setFormDisabled(true);
      document.getElementById('searchBtn').innerHTML = '<span class="spinner">⟳</span>검색 중...';
      showStatus('running', '<span class="spinner">⟳</span>검색을 시작하는 중입니다...');

      try {
        const res = await fetch(`${FUNCTION_BASE}/web-search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, keyword, platforms, period, result_count }),
        });

        const data = await res.json().catch(() => ({}));

        if (res.status === 202) {
          showStatus('done', `✓ <strong>${escapeHtml(keyword)}</strong> 검색이 시작됐어요.<br>잠시 후 노션에 결과가 저장됩니다.`);
          document.getElementById('searchBtn').textContent = '검색하기';
          document.getElementById('kw').value = '';
          setFormDisabled(false);
        } else {
          throw new Error(data.message || data.error || `오류가 발생했습니다 (${res.status})`);
        }
      } catch (err) {
        showStatus('error', err.message);
        document.getElementById('searchBtn').textContent = '검색하기';
        setFormDisabled(false);
      }
    }

    function escapeHtml(v) {
      const d = document.createElement('div');
      d.textContent = String(v ?? '');
      return d.innerHTML;
    }
  </script>
</body>
</html>
