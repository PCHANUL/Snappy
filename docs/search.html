<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy 검색</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }

    /* ── 입력 필드 ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #4b5563;
      letter-spacing: -0.2px;
    }
    #keyword, #period {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #111827;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #keyword:focus, #period:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* ── 매체 칩 ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #6b7280;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: #a5b4fc; }
    .chip.active {
      background: #eef2ff;
      border-color: #6366f1;
      color: #4338ca;
    }

    /* ── 버튼 ── */
    #searchBtn {
      width: 100%;
      padding: 14px 20px;
      margin-top: 4px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    #searchBtn:hover:not(:disabled) { background: #4f46e5; transform: translateY(-1px); }
    #searchBtn:active:not(:disabled) { transform: translateY(0); }
    #searchBtn:disabled { background: #a5b4fc; cursor: not-allowed; }
    #searchBtn.searching { background: #818cf8; cursor: not-allowed; }
    #searchBtn.unconfigured { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; pointer-events: auto; }

    /* ── 상태 메시지 ── */
    #status {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      text-align: center;
      display: none;
    }
    #status.searching {
      display: block;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
    }
    #status.accepted {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    #status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* ── 설정 안내 (파라미터 없을 때) ── */
    .config-guide {
      width: 100%;
      padding: 12px 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.6;
      text-align: center;
      display: none;
    }

    /* ── 트렌드 칩 ── */
    #trendsSection { margin-bottom: 4px; }
    .trend-chip {
      padding: 6px 12px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 999px;
      color: #9a3412;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .trend-chip:hover { background: #ffedd5; border-color: #fb923c; }

    /* ── 키워드 트렌드 ── */
    #keywordTrend {
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #374151;
      text-align: center;
      line-height: 1.7;
    }

    .disabled-overlay { opacity: 0.5; pointer-events: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="trendsSection" style="display:none">
      <div class="label">🔥 오늘의 트렌드</div>
      <div class="chips" id="trendChips" style="margin-top:6px"></div>
    </div>

    <div id="form">
      <div class="field">
        <label class="label" for="keyword">키워드</label>
        <input id="keyword" type="text" placeholder="검색할 단어 (예: 비건 디저트)" maxlength="100" autocomplete="off">
      </div>

      <div class="field" style="margin-top: 10px;">
        <label class="label">매체</label>
        <div class="chips" id="platforms">
          <button type="button" class="chip active" data-value="naver_blog">네이버블로그</button>
          <button type="button" class="chip active" data-value="youtube">유튜브</button>
          <button type="button" class="chip active" data-value="tistory">티스토리</button>
          <button type="button" class="chip active" data-value="brunch">브런치</button>
        </div>
      </div>

      <div class="field" style="margin-top: 10px;">
        <label class="label" for="period">기간</label>
        <select id="period">
          <option value="day">1일</option>
          <option value="week">1주</option>
          <option value="month" selected>1개월</option>
          <option value="year">1년</option>
        </select>
      </div>
    </div>

    <button id="searchBtn">🚀 검색하기</button>
    <div id="status"></div>
    <div id="keywordTrend" style="display:none"></div>
    <div class="config-guide" id="configGuide">
      셋업을 완료하면 이 버튼이 활성화됩니다.<br>
      <a href="https://pchanul.github.io/Snappy/" target="_blank"
         style="color:#c2410c;font-weight:600;">시작하기 →</a>
    </div>
  </div>

  <script>
    const FUNCTION_BASE = 'https://mmnwbkbipjnmsvtyohjg.supabase.co/functions/v1';

    const params         = new URLSearchParams(location.search);
    const userId         = params.get('user_id');
    const pageId         = params.get('page_id');
    const searching      = params.get('searching') === '1';
    const presetKeyword  = params.get('keyword');

    const btn         = document.getElementById('searchBtn');
    const status      = document.getElementById('status');
    const configGuide = document.getElementById('configGuide');
    const form        = document.getElementById('form');
    const keywordEl   = document.getElementById('keyword');
    const periodEl    = document.getElementById('period');
    const chipsEl     = document.getElementById('platforms');

    const configured = !!(userId && pageId);

    if (presetKeyword) keywordEl.value = presetKeyword;

    // ── 매체 칩 토글 ──────────────────────────────────────────────────────────
    chipsEl.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      chip.classList.toggle('active');
    });

    function selectedPlatforms() {
      return [...chipsEl.querySelectorAll('.chip.active')].map((c) => c.dataset.value);
    }

    // ── 초기 상태 렌더링 ─────────────────────────────────────────────────────
    if (!configured) {
      btn.classList.add('unconfigured');
      form.classList.add('disabled-overlay');
    } else if (searching) {
      // URL에 ?searching=1 → 다른 기기/새 탭에서 진행 중인 검색 표시
      btn.disabled = true;
      btn.classList.add('searching');
      btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
      form.classList.add('disabled-overlay');
      status.className = 'searching';
      status.textContent = '노션에서 검색 결과를 작성하고 있어요...';
    }

    // ── 버튼 클릭 ────────────────────────────────────────────────────────────
    btn.addEventListener('click', async () => {
      if (!configured) { configGuide.style.display = 'block'; return; }
      if (btn.disabled) return;

      const keyword   = keywordEl.value.trim();
      const platforms = selectedPlatforms();
      const period    = periodEl.value;

      // 클라이언트 검증
      if (!keyword) {
        status.className = 'error';
        status.textContent = '검색 키워드를 입력해주세요.';
        keywordEl.focus();
        return;
      }
      if (platforms.length === 0) {
        status.className = 'error';
        status.textContent = '하나 이상의 매체를 선택해주세요.';
        return;
      }

      // 1. 즉시 UI 비활성
      document.getElementById('keywordTrend').style.display = 'none';
      btn.disabled = true;
      btn.classList.add('searching');
      btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
      form.classList.add('disabled-overlay');
      status.className = 'searching';
      status.textContent = '검색을 요청하고 있어요...';

      try {
        // 2. 임베드 URL에 ?searching=1 추가 (다른 기기/새 탭 차단용)
        await fetch(FUNCTION_BASE + '/manage-user?action=set-search-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, searching: true }),
        });

        // 3. 검색 트리거
        const res = await fetch(FUNCTION_BASE + '/trigger-search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            notion_page_id: pageId,
            keyword,
            platforms,
            period,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.userMessage || data.message || '검색 요청에 실패했습니다.');

        // 202 수신 — 폴링으로 완료 감지
        status.textContent = '노션에서 검색 결과를 작성하고 있어요...';
        startPolling();

      } catch (err) {
        resetButton();
        status.className = 'error';
        status.textContent = err.message;
      }
    });

    // ── 완료 폴링 ────────────────────────────────────────────────────────────
    let pollTimer = null;

    function startPolling() {
      let attempts = 0;
      const MAX = 120; // 120 × 1s = 최대 2분

      pollTimer = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch(
            `${FUNCTION_BASE}/manage-user?action=get-search-status&user_id=${userId}`
          );
          if (!res.ok) return;
          const data = await res.json();
          if (!data.searching) {
            clearInterval(pollTimer);
            resetButton();
            if (data.error) {
              status.className = 'error';
              status.textContent = data.error;
            } else {
              status.className = 'accepted';
              status.textContent = '검색 완료! 노션에서 결과를 확인하세요.';
              showKeywordTrend(keywordEl.value.trim());
            }
          } else if (data.message) {
            status.textContent = data.message;
          }
        } catch { /* 일시적 네트워크 오류 무시 */ }

        if (attempts >= MAX) {
          clearInterval(pollTimer);
          resetButton();
          status.className = 'error';
          status.textContent = '시간이 초과됐어요. 노션을 직접 확인해주세요.';
        }
      }, 1000);
    }

    function resetButton() {
      btn.disabled = false;
      btn.classList.remove('searching');
      btn.innerHTML = '🚀 검색하기';
      form.classList.remove('disabled-overlay');
    }

    // 페이지 로드 시 한 번 즉시 상태 확인 — URL 파라미터가 스테일할 수 있으므로 API가 기준
    // API 실패 시 검색중 아님으로 간주(fail-safe) — UI가 영구 잠금되는 것 방지
    if (configured) (async () => {
      let isSearching = false;
      let lastError = null;
      try {
        const res = await fetch(`${FUNCTION_BASE}/manage-user?action=get-search-status&user_id=${userId}`);
        if (res.ok) {
          const data = await res.json();
          isSearching = !!data.searching;
          lastError = data.error ?? null;
        }
      } catch { /* 네트워크 오류 → isSearching = false 유지 */ }

      if (isSearching && !pollTimer) {
        btn.disabled = true;
        btn.classList.add('searching');
        btn.innerHTML = '<span class="spinner">⟳</span> 검색 중...';
        form.classList.add('disabled-overlay');
        status.className = 'searching';
        status.textContent = '노션에서 검색 결과를 작성하고 있어요...';
        startPolling();
      } else if (!isSearching) {
        clearInterval(pollTimer);
        pollTimer = null;
        resetButton();
        if (lastError) {
          status.className = 'error';
          status.textContent = lastError;
        } else if (searching) {
          status.className = 'accepted';
          status.textContent = '검색 완료! 노션에서 결과를 확인하세요.';
        }
      }
    })();

    // 키워드 입력 후 Enter → 검색
    keywordEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btn.click();
    });

    // ── 트렌드 ──────────────────────────────────────────────────────────────
    async function loadDailyTrends() {
      try {
        const res = await fetch(`${FUNCTION_BASE}/trend-data?action=daily`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data.topics?.length) return;

        const section = document.getElementById('trendsSection');
        const chips = document.getElementById('trendChips');
        data.topics.slice(0, 8).forEach((t) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'trend-chip';
          btn.textContent = t.keyword;
          btn.addEventListener('click', () => {
            keywordEl.value = t.keyword;
            keywordEl.focus();
          });
          chips.appendChild(btn);
        });
        section.style.display = 'block';
      } catch { /* 트렌드 로딩 실패는 무시 */ }
    }

    async function showKeywordTrend(keyword) {
      if (!keyword) return;
      try {
        const res = await fetch(
          `${FUNCTION_BASE}/trend-data?action=keyword&keyword=${encodeURIComponent(keyword)}`
        );
        if (!res.ok) return;
        const data = await res.json();
        if (!data.trend) return;

        const { direction, changePercent, points } = data.trend;
        const sparkline = toSparkline(points.map((p) => p.ratio));
        const arrow = direction === 'up' ? '📈' : direction === 'down' ? '📉' : '➡️';
        const changeText =
          direction === 'up' ? `+${changePercent}%` :
          direction === 'down' ? `${changePercent}%` : '보합';

        const el = document.getElementById('keywordTrend');
        el.innerHTML =
          `${arrow} <strong>'${keyword}'</strong> 검색량 ${changeText} (최근 2주)<br>` +
          `<span style="font-family:monospace;letter-spacing:3px;font-size:1rem">${sparkline}</span>`;
        el.style.display = 'block';
      } catch { /* 트렌드 표시 실패는 무시 */ }
    }

    function toSparkline(values) {
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;
      const chars = '▁▂▃▄▅▆▇█';
      return values.slice(-12).map((v) => chars[Math.round((v - min) / range * 7)]).join('');
    }

    if (configured) loadDailyTrends();
  </script>
</body>
</html>
