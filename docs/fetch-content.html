<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>본문 가져오기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      padding: 8px 4px;
    }
    #btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    #btn:hover:not(:disabled) { background: #4f46e5; transform: translateY(-1px); }
    #btn:active:not(:disabled) { transform: translateY(0); }
    #btn:disabled { cursor: default; }
    #btn.loading { background: #818cf8; cursor: not-allowed; }
    #btn.done    { background: #16a34a; }
    #btn.error   { background: #ef4444; }
    #btn.unconfigured { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; animation: spin 0.7s linear infinite; }

    #hint {
      margin-left: 10px;
      font-size: 0.78rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <button id="btn">📊 콘텐츠 분석</button>
  <span id="hint"></span>

  <script>
    const FUNCTION_BASE = 'https://mmnwbkbipjnmsvtyohjg.supabase.co/functions/v1';
    const params  = new URLSearchParams(location.search);
    const userId  = params.get('user_id');
    const url     = params.get('url');
    const pageId  = params.get('page_id');
    const keyword = params.get('keyword');

    const btn  = document.getElementById('btn');
    const hint = document.getElementById('hint');

    const configured = !!(userId && url && pageId);
    if (!configured) {
      btn.classList.add('unconfigured');
      btn.disabled = true;
      hint.textContent = '설정이 필요합니다';
    }

    btn.addEventListener('click', async () => {
      if (!configured || btn.disabled) return;

      btn.classList.add('loading');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner">⟳</span> 분석 중...';
      hint.textContent = '';

      try {
        const res = await fetch(`${FUNCTION_BASE}/fetch-content`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, url, page_id: pageId, keyword }),
        });
        const data = await res.json();

        btn.classList.remove('loading');

        if (res.ok && data.success) {
          btn.classList.add('done');
          btn.innerHTML = '✓ 분석 완료';
          hint.textContent = data.already_added ? '이미 추가되어 있어요' : '아래에서 확인하세요';
        } else {
          btn.classList.add('error');
          btn.innerHTML = '✗ 실패';
          hint.textContent = data.message || data.userMessage || '분석하지 못했어요';
          setTimeout(() => {
            btn.classList.remove('error');
            btn.disabled = false;
            btn.innerHTML = '📊 다시 시도';
          }, 5000);
        }
      } catch (err) {
        btn.classList.remove('loading');
        btn.classList.add('error');
        btn.innerHTML = '✗ 네트워크 오류';
        hint.textContent = '잠시 후 다시 시도해주세요';
        setTimeout(() => {
          btn.classList.remove('error');
          btn.disabled = false;
          btn.innerHTML = '📊 다시 시도';
        }, 5000);
      }
    });
  </script>
</body>
</html>
