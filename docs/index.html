<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy — 시작하기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
    }
    .container { width: 100%; max-width: 440px; padding: 24px; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { margin-top: 8px; color: #666; font-size: 0.95rem; }

    /* Step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #aaa;
      background: #fff;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .step-dot.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }
    .step-dot.done {
      background: #c7d2fe;
      border-color: #c7d2fe;
      color: #4f46e5;
    }
    .step-line {
      flex: 1;
      height: 2px;
      background: #e0e0e0;
      max-width: 48px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 24px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 0.875rem; font-weight: 600; color: #333; }
    input {
      padding: 10px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #6366f1; }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .message.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .message.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .message.hidden  { display: none; }

    /* Completion screen */
    .user-id-box {
      background: #eef2ff;
      border: 1.5px solid #c7d2fe;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 0.95rem;
      color: #3730a3;
      word-break: break-all;
      margin-bottom: 24px;
    }
    .next-steps { margin-top: 0; }
    .next-steps p { font-size: 0.875rem; font-weight: 600; color: #333; margin-bottom: 12px; }
    .next-steps ol {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .next-steps li { font-size: 0.875rem; color: #444; line-height: 1.55; }

    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Snappy</h1>
      <p class="subtitle" id="headerSubtitle">Step 1 / 3 — 이메일 가입</p>
    </header>

    <!-- Step indicator -->
    <div class="step-indicator">
      <div class="step-dot active" id="dot1">1</div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot2">2</div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot3">3</div>
    </div>

    <div class="card">
      <!-- Step 1: 이메일 가입 -->
      <div class="step active" id="step1">
        <h2>이메일 가입</h2>
        <form id="signupForm">
          <div class="field">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <button type="submit" class="btn-primary" id="signupBtn">다음 →</button>
        </form>
        <div id="signupResult" class="message hidden"></div>
      </div>

      <!-- Step 2: 노션 연동 -->
      <div class="step" id="step2">
        <h2>노션 연동</h2>
        <form id="setupForm">
          <div class="field">
            <label for="notionKey">노션 API 키</label>
            <input type="password" id="notionKey" placeholder="secret_..." required>
          </div>
          <div class="field">
            <label for="dbId">노션 데이터베이스 ID</label>
            <input type="text" id="dbId" placeholder="32자리 UUID" required>
          </div>
          <button type="submit" class="btn-primary" id="setupBtn">다음 →</button>
        </form>
        <div id="setupResult" class="message hidden"></div>
      </div>

      <!-- Step 3: 완료 -->
      <div class="step" id="step3">
        <h2>가입 완료!</h2>
        <p style="font-size:0.875rem;color:#555;margin-bottom:12px;">아래 User ID를 노션 DB에 등록해주세요.</p>
        <div class="user-id-box" id="displayUserId"></div>
        <div class="next-steps">
          <p>다음 단계</p>
          <ol>
            <li>노션 검색 DB의 <strong>user_id</strong> 속성 기본값에 위 ID를 입력하세요</li>
            <li>🚀 검색 실행 버튼 자동화를 설정하세요 (노션 템플릿 안내 참고)</li>
            <li>새 행을 추가하고 키워드를 입력한 후 🚀를 눌러 첫 검색을 시작하세요</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mmnwbkbipjnmsvtyohjg.supabase.co';
    const FUNCTION_BASE = SUPABASE_URL + '/functions/v1';

    let currentStep = 1;
    let userId = null;

    const subtitles = ['Step 1 / 3 — 이메일 가입', 'Step 2 / 3 — 노션 연동', 'Step 3 / 3 — 완료'];

    function goToStep(n) {
      document.getElementById('step' + currentStep).classList.remove('active');
      currentStep = n;
      document.getElementById('step' + currentStep).classList.add('active');
      document.getElementById('headerSubtitle').textContent = subtitles[n - 1];

      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById('dot' + i);
        dot.classList.remove('active', 'done');
        if (i < n) dot.classList.add('done');
        else if (i === n) dot.classList.add('active');
      }
    }

    // Step 1: signup
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const result = document.getElementById('signupResult');
      btn.disabled = true;
      btn.textContent = '처리 중...';
      result.className = 'message hidden';

      try {
        const res = await fetch(FUNCTION_BASE + '/manage-user?action=signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '가입에 실패했습니다.');
        userId = data.user_id;
        goToStep(2);
      } catch (err) {
        result.className = 'message error';
        result.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '다음 →';
      }
    });

    // Step 2: setup-notion
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('setupBtn');
      const result = document.getElementById('setupResult');
      btn.disabled = true;
      btn.textContent = '처리 중...';
      result.className = 'message hidden';

      try {
        const res = await fetch(FUNCTION_BASE + '/manage-user?action=setup-notion', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            notion_api_key: document.getElementById('notionKey').value.trim(),
            notion_database_id: document.getElementById('dbId').value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '연동에 실패했습니다.');
        document.getElementById('displayUserId').textContent = userId;
        goToStep(3);
      } catch (err) {
        result.className = 'message error';
        result.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '다음 →';
      }
    });
  </script>
</body>
</html>
