<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy SEO vs AI 측정</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      padding: 14px 16px;
      color: #111827;
    }

    .header { margin-bottom: 12px; }
    .title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #374151;
      letter-spacing: -0.2px;
    }
    .subtitle { font-size: 0.7rem; color: #9ca3af; margin-top: 2px; }

    /* 입력 폼 */
    #form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; }
    .field { flex: 1; }
    .label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 3px;
    }
    input[type="text"], input[type="url"], select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      color: #111827;
      background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: #6366f1; }
    input:disabled, select:disabled { background: #f9fafb; color: #9ca3af; }

    #measureBtn {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    #measureBtn:hover { background: #374151; }
    #measureBtn:disabled { background: #d1d5db; cursor: default; }

    /* 질의문 미리보기 */
    .preview {
      font-size: 0.72rem;
      color: #6b7280;
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;
      display: none;
    }
    .preview b { color: #4338ca; font-weight: 600; }

    /* 엔티티 추적 패널 */
    .entity-panel {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .entity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f9fafb;
      cursor: pointer;
      user-select: none;
    }
    .entity-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #374151;
    }
    .entity-badge {
      font-size: 0.62rem;
      background: #e0e7ff;
      color: #4338ca;
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 700;
    }
    .entity-toggle {
      font-size: 0.72rem;
      color: #9ca3af;
      transition: transform 0.15s;
    }
    .entity-toggle.open { transform: rotate(180deg); }
    .entity-body {
      padding: 10px 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .entity-body.open { display: flex; }

    .entity-select-row { display: flex; gap: 8px; align-items: flex-end; }
    .entity-select-row .field { flex: 1; }

    .link-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.72rem;
      color: #6366f1;
      font-family: inherit;
      padding: 0;
      font-weight: 600;
      white-space: nowrap;
    }
    .link-btn:hover { color: #4338ca; text-decoration: underline; }
    .link-btn.danger { color: #ef4444; }
    .link-btn.danger:hover { color: #b91c1c; }

    .entity-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* 인라인 폼 (엔티티·키워드 추가) */
    .inline-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .inline-form.open { display: flex; }
    .inline-form-row { display: flex; gap: 8px; }
    .inline-form-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 2px;
    }
    .inline-save-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #6366f1;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .inline-save-btn:hover { background: #4f46e5; }
    .inline-save-btn:disabled { background: #c7d2fe; cursor: default; }
    .inline-cancel-btn {
      padding: 6px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #fff;
      color: #6b7280;
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
    }
    .inline-form-btns { display: flex; gap: 6px; }

    /* 저장 표시기 */
    .saved-indicator {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: #059669;
      font-weight: 600;
      margin-top: 6px;
    }
    .saved-indicator.show { display: flex; }

    /* 격차 매트릭스 */
    .section-title {
      font-size: 0.74rem;
      font-weight: 700;
      color: #374151;
      margin: 14px 0 7px;
    }
    .gap-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      transition: background 0.12s;
    }
    .gap-row:hover { background: #f9fafb; }
    .gap-row.self {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
    }
    .gap-row.self:hover { background: #e0e7ff; }

    .domain {
      flex: 1;
      font-size: 0.84rem;
      font-weight: 600;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .self-tag {
      font-size: 0.62rem;
      font-weight: 700;
      color: #4338ca;
      background: #e0e7ff;
      padding: 1px 6px;
      border-radius: 999px;
      margin-left: 4px;
    }
    .ranks { display: flex; gap: 5px; flex-shrink: 0; }
    .badge {
      font-size: 0.66rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge.seo { background: #dcfce7; color: #166534; }
    .badge.geo { background: #ede9fe; color: #6d28d9; }
    .badge.none { background: #f3f4f6; color: #d1d5db; }

    .bucket-tag {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .bucket-tag.both { background: #fef3c7; color: #92400e; }
    .bucket-tag.seo_only { background: #dcfce7; color: #166534; }
    .bucket-tag.geo_only { background: #ede9fe; color: #6d28d9; }

    /* AI 인용 목록 */
    .cite {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 8px;
      font-size: 0.8rem;
      border-radius: 6px;
    }
    .cite:hover { background: #f9fafb; }
    .cite-rank { font-size: 0.7rem; color: #c4b5fd; font-weight: 700; width: 14px; flex-shrink: 0; }
    .cite a { color: #4f46e5; text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cite a:hover { text-decoration: underline; }

    /* 타임라인 */
    .timeline-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .timeline-section { margin-top: 12px; display: none; }
    .timeline-section.open { display: block; }
    .timeline-table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
    .timeline-table th {
      text-align: left;
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
      padding: 4px 6px;
      border-bottom: 1px solid #f3f4f6;
    }
    .timeline-table td {
      padding: 6px 6px;
      border-bottom: 1px solid #f9fafb;
      color: #374151;
    }
    .timeline-table tr:last-child td { border-bottom: none; }
    .timeline-table tr:hover td { background: #f9fafb; }
    .tl-rank { font-weight: 700; color: #6d28d9; }
    .tl-none { color: #d1d5db; }

    .notice {
      font-size: 0.68rem;
      color: #9ca3af;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #f3f4f6;
      line-height: 1.5;
    }

    .empty { text-align: center; color: #9ca3af; padding: 20px 0; font-size: 0.8rem; }
    .skeleton {
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(90deg, #f3f4f6 25%, #e9eaf0 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      margin-bottom: 4px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .legend { display: flex; gap: 10px; font-size: 0.66rem; color: #9ca3af; margin-bottom: 4px; }
    .legend span { display: inline-flex; align-items: center; gap: 3px; }
    .dot { width: 8px; height: 8px; border-radius: 2px; }
    .dot.both { background: #fbbf24; }
    .dot.seo_only { background: #4ade80; }
    .dot.geo_only { background: #a78bfa; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🔍 SEO vs AI 측정</div>
    <div class="subtitle">키워드 하나로 검색 노출과 AI 인용을 나란히 비교해요</div>
  </div>

  <form id="form" autocomplete="off">
    <div class="field">
      <span class="label">키워드</span>
      <input type="text" id="keyword" placeholder="예: 강남 치과 임플란트" required>
    </div>
    <div class="row">
      <div class="field">
        <span class="label">AI 질문 의도</span>
        <select id="intent">
          <option value="recommend">추천형</option>
          <option value="info">정보형</option>
          <option value="compare">비교형</option>
        </select>
      </div>
      <div class="field">
        <span class="label">내 도메인 (선택)</span>
        <input type="text" id="selfDomain" placeholder="example.com">
      </div>
    </div>
    <button type="submit" id="measureBtn">측정하기</button>
  </form>

  <div class="preview" id="preview"></div>

  <!-- 엔티티 추적 패널 (user_id 있을 때만 표시) -->
  <div class="entity-panel" id="entityPanel" style="display:none">
    <div class="entity-header" id="entityHeader">
      <div class="entity-header-left">
        <span>📌 엔티티 추적</span>
        <span class="entity-badge" id="trackingBadge" style="display:none">추적 중</span>
      </div>
      <span class="entity-toggle" id="entityToggle">▼</span>
    </div>
    <div class="entity-body" id="entityBody">
      <!-- 엔티티 선택 -->
      <div class="entity-select-row">
        <div class="field">
          <span class="label">엔티티</span>
          <select id="entitySelect">
            <option value="">선택 안 함 (1회 측정)</option>
          </select>
        </div>
        <button type="button" class="link-btn" id="newEntityBtn">+ 새 엔티티</button>
      </div>

      <!-- 새 엔티티 인라인 폼 -->
      <div class="inline-form" id="newEntityForm">
        <div class="inline-form-title">새 엔티티 등록</div>
        <div class="inline-form-row">
          <div class="field">
            <span class="label">이름</span>
            <input type="text" id="newEntityName" placeholder="예: 강남치과의원">
          </div>
          <div class="field">
            <span class="label">유형</span>
            <select id="newEntityType">
              <option value="brand">브랜드</option>
              <option value="website">웹사이트</option>
              <option value="product">제품</option>
              <option value="person">인물</option>
            </select>
          </div>
        </div>
        <div class="field">
          <span class="label">내 도메인 (선택)</span>
          <input type="text" id="newEntityDomain" placeholder="example.com">
        </div>
        <div class="inline-form-btns">
          <button type="button" class="inline-save-btn" id="saveEntityBtn">등록</button>
          <button type="button" class="inline-cancel-btn" id="cancelEntityBtn">취소</button>
        </div>
      </div>

      <!-- 추적 키워드 선택 (엔티티 선택 시만 표시) -->
      <div id="keywordTrackRow" style="display:none">
        <div class="entity-select-row">
          <div class="field">
            <span class="label">추적 키워드</span>
            <select id="trackedKeywordSelect">
              <option value="">키워드 직접 입력 (저장 안 함)</option>
            </select>
          </div>
          <button type="button" class="link-btn" id="newKeywordBtn">+ 키워드 추가</button>
        </div>

        <!-- 새 키워드 인라인 폼 -->
        <div class="inline-form" id="newKeywordForm" style="margin-top:8px">
          <div class="inline-form-title">키워드 추가</div>
          <div class="inline-form-row">
            <div class="field">
              <span class="label">키워드</span>
              <input type="text" id="newKwText" placeholder="예: 강남 임플란트">
            </div>
            <div class="field">
              <span class="label">질문 의도</span>
              <select id="newKwIntent">
                <option value="recommend">추천형</option>
                <option value="info">정보형</option>
                <option value="compare">비교형</option>
              </select>
            </div>
          </div>
          <div class="inline-form-btns">
            <button type="button" class="inline-save-btn" id="saveKeywordBtn">추가</button>
            <button type="button" class="inline-cancel-btn" id="cancelKeywordBtn">취소</button>
          </div>
        </div>
      </div>

      <!-- 저장 표시기 -->
      <div class="saved-indicator" id="savedIndicator">
        <span>✓</span><span>이 측정이 타임라인에 저장되었어요</span>
        <button type="button" class="link-btn" id="showTimelineBtn" style="margin-left:4px">기록 보기</button>
      </div>
    </div>
  </div>

  <div id="result"></div>

  <!-- 타임라인 (측정 후 표시) -->
  <div class="timeline-section" id="timelineSection">
    <div class="section-title">📈 측정 기록</div>
    <div id="timelineContent"></div>
  </div>

  <script>
    const FUNCTION_BASE = 'https://mmnwbkbipjnmsvtyohjg.supabase.co/functions/v1';
    const params = new URLSearchParams(location.search);
    const userId = params.get('user_id');

    const form        = document.getElementById('form');
    const keywordEl   = document.getElementById('keyword');
    const intentEl    = document.getElementById('intent');
    const selfEl      = document.getElementById('selfDomain');
    const measureBtn  = document.getElementById('measureBtn');
    const previewEl   = document.getElementById('preview');
    const resultEl    = document.getElementById('result');

    // 엔티티 패널 요소
    const entityPanel   = document.getElementById('entityPanel');
    const entityHeader  = document.getElementById('entityHeader');
    const entityToggle  = document.getElementById('entityToggle');
    const entityBody    = document.getElementById('entityBody');
    const trackingBadge = document.getElementById('trackingBadge');
    const entitySelect  = document.getElementById('entitySelect');
    const newEntityBtn  = document.getElementById('newEntityBtn');
    const newEntityForm = document.getElementById('newEntityForm');
    const newEntityName = document.getElementById('newEntityName');
    const newEntityType = document.getElementById('newEntityType');
    const newEntityDomain = document.getElementById('newEntityDomain');
    const saveEntityBtn   = document.getElementById('saveEntityBtn');
    const cancelEntityBtn = document.getElementById('cancelEntityBtn');
    const keywordTrackRow       = document.getElementById('keywordTrackRow');
    const trackedKeywordSelect  = document.getElementById('trackedKeywordSelect');
    const newKeywordBtn    = document.getElementById('newKeywordBtn');
    const newKeywordForm   = document.getElementById('newKeywordForm');
    const newKwText        = document.getElementById('newKwText');
    const newKwIntent      = document.getElementById('newKwIntent');
    const saveKeywordBtn   = document.getElementById('saveKeywordBtn');
    const cancelKeywordBtn = document.getElementById('cancelKeywordBtn');
    const savedIndicator  = document.getElementById('savedIndicator');
    const showTimelineBtn = document.getElementById('showTimelineBtn');
    const timelineSection = document.getElementById('timelineSection');
    const timelineContent = document.getElementById('timelineContent');

    const QUESTION_TEMPLATES = {
      recommend: (k) => `${k} 추천해줘`,
      info: (k) => `${k}에 대해 알려줘`,
      compare: (k) => `${k} 비교해줘`,
    };
    const BUCKET_LABEL = { both: '둘 다', seo_only: 'SEO만', geo_only: 'AI만' };

    // URL 파라미터로 키워드 선채움
    if (params.get('keyword')) keywordEl.value = params.get('keyword');

    // ── 엔티티 패널 초기화 ───────────────────────────────────────────────────
    if (userId) {
      entityPanel.style.display = 'block';
      loadEntities();
    }

    // 패널 토글
    entityHeader.addEventListener('click', () => {
      entityBody.classList.toggle('open');
      entityToggle.classList.toggle('open');
    });

    // ── 엔티티 CRUD ─────────────────────────────────────────────────────────

    async function loadEntities() {
      try {
        const res = await fetch(`${FUNCTION_BASE}/geo-entities?action=list-entities&user_id=${encodeURIComponent(userId)}`);
        const data = await res.json();
        const entities = data.entities || [];
        entitySelect.innerHTML = '<option value="">선택 안 함 (1회 측정)</option>';
        for (const e of entities) {
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.dataset.selfDomain = e.self_domain || '';
          opt.textContent = e.name + (e.self_domain ? ` (${e.self_domain})` : '');
          entitySelect.appendChild(opt);
        }
      } catch { /* 엔티티 로드 실패는 비치명적 */ }
    }

    entitySelect.addEventListener('change', async () => {
      const entityId = entitySelect.value;
      if (!entityId) {
        keywordTrackRow.style.display = 'none';
        trackingBadge.style.display = 'none';
        const opt = entitySelect.options[entitySelect.selectedIndex];
        if (opt?.dataset?.selfDomain) selfEl.value = '';
        return;
      }
      // 엔티티의 self_domain을 내 도메인 입력란에 채움
      const opt = entitySelect.options[entitySelect.selectedIndex];
      if (opt?.dataset?.selfDomain) selfEl.value = opt.dataset.selfDomain;

      keywordTrackRow.style.display = 'block';
      await loadTrackedKeywords(entityId);
    });

    async function loadTrackedKeywords(entityId) {
      try {
        const res = await fetch(`${FUNCTION_BASE}/geo-entities?action=list-keywords&entity_id=${encodeURIComponent(entityId)}`);
        const data = await res.json();
        const keywords = data.keywords || [];
        trackedKeywordSelect.innerHTML = '<option value="">키워드 직접 입력 (저장 안 함)</option>';
        for (const k of keywords) {
          const opt = document.createElement('option');
          opt.value = k.id;
          opt.dataset.keyword = k.keyword;
          opt.dataset.intent = k.intent;
          opt.textContent = k.keyword + ' (' + intentLabel(k.intent) + ')';
          trackedKeywordSelect.appendChild(opt);
        }
      } catch { /* 키워드 로드 실패는 비치명적 */ }
    }

    trackedKeywordSelect.addEventListener('change', () => {
      const opt = trackedKeywordSelect.options[trackedKeywordSelect.selectedIndex];
      if (opt?.dataset?.keyword) {
        keywordEl.value = opt.dataset.keyword;
        intentEl.value = opt.dataset.intent || 'recommend';
        trackingBadge.style.display = 'inline';
        updatePreview();
      } else {
        trackingBadge.style.display = 'none';
      }
    });

    // 새 엔티티 폼
    newEntityBtn.addEventListener('click', () => {
      newEntityForm.classList.toggle('open');
      if (newEntityForm.classList.contains('open')) newEntityName.focus();
    });
    cancelEntityBtn.addEventListener('click', () => newEntityForm.classList.remove('open'));
    saveEntityBtn.addEventListener('click', async () => {
      const name = newEntityName.value.trim();
      if (!name) { newEntityName.focus(); return; }
      saveEntityBtn.disabled = true;
      try {
        const res = await fetch(`${FUNCTION_BASE}/geo-entities?action=register-entity`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            name,
            self_domain: newEntityDomain.value.trim() || undefined,
            type: newEntityType.value,
          }),
        });
        if (!res.ok) throw new Error();
        newEntityForm.classList.remove('open');
        newEntityName.value = '';
        newEntityDomain.value = '';
        await loadEntities();
      } catch {
        alert('엔티티 등록에 실패했어요.');
      } finally {
        saveEntityBtn.disabled = false;
      }
    });

    // 새 키워드 폼
    newKeywordBtn.addEventListener('click', () => {
      newKeywordForm.classList.toggle('open');
      if (newKeywordForm.classList.contains('open')) {
        newKwText.value = keywordEl.value;
        newKwIntent.value = intentEl.value;
        newKwText.focus();
      }
    });
    cancelKeywordBtn.addEventListener('click', () => newKeywordForm.classList.remove('open'));
    saveKeywordBtn.addEventListener('click', async () => {
      const keyword = newKwText.value.trim();
      if (!keyword) { newKwText.focus(); return; }
      const entityId = entitySelect.value;
      if (!entityId) return;
      saveKeywordBtn.disabled = true;
      try {
        const res = await fetch(`${FUNCTION_BASE}/geo-entities?action=add-keyword`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            entity_id: entityId,
            keyword,
            intent: newKwIntent.value,
          }),
        });
        if (!res.ok) throw new Error();
        newKeywordForm.classList.remove('open');
        newKwText.value = '';
        await loadTrackedKeywords(entityId);
        // 추가한 키워드 자동 선택
        const opts = trackedKeywordSelect.options;
        for (let i = 0; i < opts.length; i++) {
          if (opts[i].dataset.keyword === keyword) {
            trackedKeywordSelect.selectedIndex = i;
            trackedKeywordSelect.dispatchEvent(new Event('change'));
            break;
          }
        }
      } catch {
        alert('키워드 추가에 실패했어요.');
      } finally {
        saveKeywordBtn.disabled = false;
      }
    });

    // ── 타임라인 ─────────────────────────────────────────────────────────────

    showTimelineBtn.addEventListener('click', () => {
      timelineSection.classList.toggle('open');
      showTimelineBtn.textContent = timelineSection.classList.contains('open') ? '기록 닫기' : '기록 보기';
    });

    async function loadTimeline(keywordId, selfDomain) {
      try {
        let url = `${FUNCTION_BASE}/geo-entities?action=timeline&keyword_id=${encodeURIComponent(keywordId)}`;
        if (selfDomain) url += `&self_domain=${encodeURIComponent(selfDomain)}`;
        const res = await fetch(url);
        const data = await res.json();
        renderTimeline(data.timeline || []);
      } catch {
        timelineContent.innerHTML = '<div class="empty">기록을 불러올 수 없어요.</div>';
      }
    }

    function renderTimeline(timeline) {
      if (!timeline.length) {
        timelineContent.innerHTML = '<div class="empty">아직 저장된 측정 기록이 없어요.</div>';
        return;
      }
      const table = document.createElement('table');
      table.className = 'timeline-table';
      table.innerHTML = '<thead><tr><th>날짜</th><th>AI 인용</th><th>SEO 수</th><th>자기도메인 AI순위</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const r of timeline) {
        const tr = document.createElement('tr');
        const date = new Date(r.run_at).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const selfRank = r.self_geo_rank !== undefined && r.self_geo_rank !== null
          ? `<span class="tl-rank">${r.self_geo_rank}위</span>`
          : `<span class="tl-none">–</span>`;
        tr.innerHTML = `<td>${escapeHtml(date)}</td><td>${r.citation_count}</td><td>${r.seo_count}</td><td>${selfRank}</td>`;
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      timelineContent.innerHTML = '';
      timelineContent.appendChild(table);
    }

    // ── 질의문 미리보기 ──────────────────────────────────────────────────────

    function updatePreview() {
      const k = keywordEl.value.trim();
      if (!k) { previewEl.style.display = 'none'; return; }
      const q = QUESTION_TEMPLATES[intentEl.value]?.(k) ?? k;
      previewEl.innerHTML = `SEO 검색어: <b>${escapeHtml(k)}</b><br>AI 질의문: <b>${escapeHtml(q)}</b>`;
      previewEl.style.display = 'block';
    }
    keywordEl.addEventListener('input', updatePreview);
    intentEl.addEventListener('change', updatePreview);
    updatePreview();

    // ── 측정 실행 ────────────────────────────────────────────────────────────

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const keyword = keywordEl.value.trim();
      if (!keyword) return;
      if (!userId) { showEmpty('사용자 정보가 없어요. 노션 임베드에서 열어주세요.'); return; }

      measureBtn.disabled = true;
      measureBtn.textContent = '측정 중...';
      savedIndicator.classList.remove('show');
      timelineSection.classList.remove('open');
      showSkeleton(5);

      // 현재 선택된 추적 키워드 ID
      const kwOpt = trackedKeywordSelect.options[trackedKeywordSelect.selectedIndex];
      const keywordId = kwOpt?.value || undefined;

      try {
        const res = await fetch(`${FUNCTION_BASE}/geo-measure`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            keyword,
            intent: intentEl.value,
            self_domain: selfEl.value.trim() || undefined,
            keyword_id: keywordId || undefined,
          }),
        });
        const data = await res.json();
        if (!res.ok) { showEmpty(data.message || '측정에 실패했어요.'); return; }
        render(data);

        // 저장됐을 경우 표시 + 타임라인 로드
        if (data.saved && keywordId) {
          savedIndicator.classList.add('show');
          const selfDomain = selfEl.value.trim() || '';
          await loadTimeline(keywordId, selfDomain);
          showTimelineBtn.textContent = '기록 보기';
        }
      } catch {
        showEmpty('측정 중 오류가 발생했어요.');
      } finally {
        measureBtn.disabled = false;
        measureBtn.textContent = '측정하기';
      }
    });

    // ── 렌더링 ───────────────────────────────────────────────────────────────

    function render(data) {
      resultEl.innerHTML = '';

      // 격차 매트릭스
      const gap = data.gap || [];
      if (gap.length) {
        resultEl.appendChild(sectionTitle('격차 매트릭스'));
        resultEl.appendChild(legend());
        gap.forEach((g) => resultEl.appendChild(gapRow(g)));
      } else {
        resultEl.appendChild(emptyEl('비교할 도메인이 없어요.'));
      }

      // AI 인용 목록
      const geo = data.geo || {};
      if (geo.available && geo.citations?.length) {
        resultEl.appendChild(sectionTitle(`AI 인용 (${geo.engine} · ${geo.citations.length}개)`));
        geo.citations.forEach((c) => resultEl.appendChild(citeRow(c)));
      } else if (geo.available) {
        resultEl.appendChild(sectionTitle('AI 인용'));
        resultEl.appendChild(emptyEl('이번 응답에서 AI가 인용한 출처가 없어요.'));
      }

      // 스냅샷 경고
      if (data.notice) {
        const n = document.createElement('div');
        n.className = 'notice';
        n.textContent = '⚠️ ' + data.notice;
        resultEl.appendChild(n);
      }
    }

    function gapRow(g) {
      const row = document.createElement('div');
      row.className = 'gap-row' + (g.isSelf ? ' self' : '');
      const domain = document.createElement('span');
      domain.className = 'domain';
      domain.textContent = g.rootDomain;
      if (g.isSelf) {
        const tag = document.createElement('span');
        tag.className = 'self-tag';
        tag.textContent = '내 도메인';
        domain.appendChild(tag);
      }
      const bucket = document.createElement('span');
      bucket.className = 'bucket-tag ' + g.bucket;
      bucket.textContent = BUCKET_LABEL[g.bucket] || g.bucket;
      const ranks = document.createElement('span');
      ranks.className = 'ranks';
      ranks.appendChild(badge('seo', g.seoRank !== undefined ? `SEO ${g.seoRank}위` : null));
      ranks.appendChild(badge('geo', g.geoRank !== undefined ? `AI ${g.geoRank}위` : null));
      row.appendChild(domain);
      row.appendChild(bucket);
      row.appendChild(ranks);
      return row;
    }

    function badge(kind, text) {
      const b = document.createElement('span');
      if (text) { b.className = 'badge ' + kind; b.textContent = text; }
      else { b.className = 'badge none'; b.textContent = '–'; }
      return b;
    }

    function citeRow(c) {
      const row = document.createElement('div');
      row.className = 'cite';
      const rank = document.createElement('span');
      rank.className = 'cite-rank';
      rank.textContent = c.rank;
      const a = document.createElement('a');
      a.href = c.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = c.title || c.rootDomain || c.url;
      row.appendChild(rank);
      row.appendChild(a);
      return row;
    }

    function sectionTitle(text) {
      const el = document.createElement('div');
      el.className = 'section-title';
      el.textContent = text;
      return el;
    }

    function legend() {
      const el = document.createElement('div');
      el.className = 'legend';
      el.innerHTML =
        '<span><span class="dot both"></span>둘 다</span>' +
        '<span><span class="dot seo_only"></span>SEO만</span>' +
        '<span><span class="dot geo_only"></span>AI만</span>';
      return el;
    }

    function emptyEl(msg) {
      const el = document.createElement('div');
      el.className = 'empty';
      el.textContent = msg;
      return el;
    }

    function showEmpty(msg) { resultEl.innerHTML = ''; resultEl.appendChild(emptyEl(msg)); }

    function showSkeleton(n) {
      resultEl.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const sk = document.createElement('div');
        sk.className = 'skeleton';
        resultEl.appendChild(sk);
      }
    }

    function intentLabel(intent) {
      return { recommend: '추천형', info: '정보형', compare: '비교형' }[intent] || intent;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
