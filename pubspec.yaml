name: snappy
description: A BYOK Flutter app that turns one source content into multiple reusable media outputs.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_image_compress: ^2.3.0
  flutter_markdown: ^0.7.3+1
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  image_picker: ^1.1.2
  logger: ^2.4.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
